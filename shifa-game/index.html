<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>时空法典 · 初二史法期末冲刺</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0f1e;
    background-image:
      radial-gradient(900px 500px at 50% -10%, rgba(56,189,248,.14), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, rgba(212,164,76,.10), transparent 60%);
    color: #e8eef8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  #wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 44px; min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 2px;
    background: linear-gradient(180deg, rgba(10,15,30,.97) 70%, rgba(10,15,30,0));
  }
  header button {
    width: 40px; height: 40px; flex: none; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: #cbd5e1; font-size: 20px; line-height: 1;
  }
  header button:active { transform: scale(.94); }
  #hdrTitle { flex: 1; font-size: 17px; font-weight: 800; letter-spacing: .5px; color: #f1f5f9; text-align: center; }
  .view { display: none; }
  .view.on { display: block; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- 首页 ---------- */
  .hero {
    text-align: center; padding: 26px 10px 18px;
    border-radius: 18px; margin-top: 4px;
    background: linear-gradient(160deg, rgba(56,189,248,.10), rgba(212,164,76,.08));
    border: 1px solid rgba(255,255,255,.08);
  }
  .hero-title {
    font-size: 30px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(120deg, #f5d08a, #e8b64c, #d4a44c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-sub { font-size: 12px; color: #94a3b8; margin-top: 8px; letter-spacing: 2px; }
  .rank-row { margin-top: 14px; font-size: 13px; color: #cbd5e1; }
  .rank-row b { color: #facc15; }
  .subj-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .subj-card {
    border-radius: 16px; padding: 16px 14px; cursor: pointer; position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.10);
  }
  .subj-card:active { transform: scale(.975); }
  .subj-card.h { background: linear-gradient(160deg, rgba(212,164,76,.22), rgba(30,24,10,.6)); border-color: rgba(212,164,76,.38); }
  .subj-card.s { background: linear-gradient(160deg, rgba(56,189,248,.20), rgba(10,25,40,.6)); border-color: rgba(56,189,248,.35); }
  .sc-ico { font-size: 30px; }
  .sc-name { font-size: 16px; font-weight: 800; margin-top: 6px; }
  .sc-desc { font-size: 11px; color: #9db1d6; margin-top: 4px; line-height: 1.5; }
  .sc-star { font-size: 12px; color: #facc15; margin-top: 8px; font-weight: 700; }
  .stat-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px;
  }
  .stat-cell {
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 10px 6px; text-align: center;
  }
  .stat-cell b { display: block; font-size: 18px; color: #7dd3fc; }
  .stat-cell span { font-size: 11px; color: #94a3b8; }
  .menu { margin-top: 16px; display: grid; gap: 10px; }
  .menu button {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 14px 16px; border-radius: 14px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
    color: #e8eef8; font-size: 15px; font-weight: 700; text-align: left;
  }
  .menu button:active { transform: scale(.985); }
  .menu button em { font-style: normal; font-size: 12px; color: #94a3b8; font-weight: 400; }

  /* ---------- 章节列表 ---------- */
  .ch-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 13px 14px; margin-top: 10px; color: inherit; font: inherit;
  }
  .ch-card:active { transform: scale(.985); }
  .ch-top { display: flex; align-items: center; gap: 8px; }
  .ch-no {
    flex: none; width: 26px; height: 26px; border-radius: 8px; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    background: rgba(56,189,248,.15); color: #7dd3fc;
  }
  .ch-card.h .ch-no { background: rgba(212,164,76,.18); color: #f0c060; }
  .ch-title { flex: 1; font-size: 15px; font-weight: 800; }
  .ch-stars { font-size: 14px; color: #facc15; letter-spacing: 1px; }
  .ch-unit { font-size: 10px; color: #64748b; margin-top: 6px; }
  .ch-desc { font-size: 11px; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
  .ch-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; color: #7dd3fc; }
  .ch-meta .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .ch-meta .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #38bdf8, #22d3ee); }
  .ch-card.h .ch-meta .bar i { background: linear-gradient(90deg, #d4a44c, #facc15); }

  /* ---------- 答题 ---------- */
  .qtop { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #94a3b8; flex-wrap: wrap; }
  .qprog { font-weight: 800; color: #7dd3fc; }
  .qbar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; min-width: 60px; }
  .qbar i { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #22d3ee); transition: width .25s; }
  .boss-tag, .src-tag, .combo-tag {
    font-size: 10px; padding: 3px 8px; border-radius: 999px; font-weight: 700;
  }
  .boss-tag { background: rgba(250,204,21,.15); color: #facc15; border: 1px solid rgba(250,204,21,.35); }
  .src-tag { background: rgba(168,85,247,.14); color: #c084fc; border: 1px solid rgba(168,85,247,.35); }
  .combo-tag { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.35); }
  .mat {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.8;
    background: rgba(56,189,248,.06); border: 1px dashed rgba(56,189,248,.30); color: #cbd5e1;
    white-space: pre-wrap;
  }
  .stem { margin-top: 14px; font-size: 16px; font-weight: 700; line-height: 1.7; color: #f1f5f9; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 10px; }
  #qBody { margin-top: 12px; display: grid; gap: 10px; }
  .opt {
    width: 100%; text-align: left; padding: 13px 14px; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    color: #e8eef8; font-size: 14px; line-height: 1.6; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .opt:active { transform: scale(.99); }
  .opt:disabled { cursor: default; }
  .opt.ok { background: rgba(34,197,94,.16); border-color: #22c55e; color: #bbf7d0; }
  .opt.bad { background: rgba(239,68,68,.16); border-color: #ef4444; color: #fecaca; }
  .chip {
    padding: 11px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #e8eef8;
    font-family: inherit; text-align: left;
  }
  .chip.sel { background: rgba(56,189,248,.16); border-color: #38bdf8; color: #bae6fd; }
  .chip.ok { background: rgba(34,197,94,.14); border-color: #22c55e; color: #bbf7d0; }
  .orderline { font-size: 12px; color: #facc15; margin-top: 6px; line-height: 1.7; }
  .order-final { display: grid; gap: 8px; margin-top: 8px; }
  .jstep { font-size: 13px; font-weight: 800; color: #7dd3fc; margin: 4px 0; }
  .btn {
    padding: 13px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); cursor: pointer;
    background: rgba(255,255,255,.06); color: #e8eef8; font-size: 15px; font-weight: 800; font-family: inherit;
  }
  .btn.primary { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #0ea5e9; }
  .btn.gold { background: linear-gradient(135deg, #b8860b, #8b6914); border-color: #d4a44c; }
  .btn:disabled { opacity: .4; }
  .btn:active { transform: scale(.98); }
  .exp {
    margin-top: 14px; padding: 13px 14px; border-radius: 12px; font-size: 13px; line-height: 1.8;
    background: rgba(250,204,21,.07); border: 1px solid rgba(250,204,21,.25); color: #e2e8f0;
  }
  .exp .kp { color: #7dd3fc; font-size: 12px; }
  #qNext { margin-top: 16px; display: grid; }

  /* ---------- 结算 ---------- */
  .res-box {
    text-align: center; padding: 30px 16px; border-radius: 18px; margin-top: 10px;
    background: linear-gradient(160deg, rgba(56,189,248,.10), rgba(212,164,76,.08));
    border: 1px solid rgba(255,255,255,.10);
  }
  .stars-big { font-size: 40px; color: #facc15; letter-spacing: 8px; }
  .res-title { font-size: 20px; font-weight: 900; color: #f1f5f9; }
  .res-main { font-size: 16px; margin-top: 10px; color: #cbd5e1; }
  .res-main b { font-size: 26px; color: #4ade80; }
  .res-sub { font-size: 12px; color: #94a3b8; margin-top: 8px; }
  .res-btns { display: flex; gap: 10px; margin-top: 16px; }
  .res-btns .btn { flex: 1; }

  /* ---------- 通用列表 ---------- */
  .sec-title { font-size: 14px; font-weight: 800; color: #7dd3fc; margin: 18px 2px 2px; }
  .empty-tip { text-align: center; color: #64748b; font-size: 13px; padding: 40px 10px; line-height: 1.8; }
  .wq-card {
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09);
    border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 13px; line-height: 1.6;
  }
  .wq-card .wq-ch { font-size: 10px; color: #f87171; font-weight: 700; }
  .wq-card .wq-q { margin-top: 4px; color: #e2e8f0; }
  .wq-card .wq-a { margin-top: 6px; font-size: 12px; color: #4ade80; }

  /* ---------- 模拟卷 ---------- */
  .mock-card {
    width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
    border-radius: 16px; padding: 18px 16px; margin-top: 12px;
  }
  .mock-card:active { transform: scale(.985); }
  .mock-card .mc-title { font-size: 17px; font-weight: 900; }
  .mock-card .mc-desc { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.6; }
  .mock-card .mc-best { font-size: 12px; color: #facc15; margin-top: 8px; font-weight: 700; }
  #mockTimer {
    font-size: 13px; font-weight: 800; color: #f87171; font-variant-numeric: tabular-nums;
    padding: 3px 10px; border-radius: 999px; background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.3);
  }

  /* ---------- 知识卡 ---------- */
  .kcard {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  }
  .kcard.lit { border-color: rgba(250,204,21,.35); background: rgba(250,204,21,.05); }
  .kc-top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; }
  .kc-badge { margin-left: auto; font-size: 11px; color: #64748b; font-weight: 700; }
  .kcard.lit .kc-badge { color: #facc15; }
  .kc-text { font-size: 12px; color: #9db1d6; line-height: 1.8; margin-top: 6px; }
  .subject-tabs { display: flex; gap: 8px; margin-top: 12px; }
  .subject-tabs button {
    flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 800;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #94a3b8;
    font-family: inherit;
  }
  .subject-tabs button.on { background: rgba(56,189,248,.16); border-color: #38bdf8; color: #e0f2fe; }

  /* ---------- 报告 ---------- */
  .rep-row { margin-top: 12px; }
  .rep-head { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
  .rep-head b { color: #7dd3fc; }
  .rep-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.07); margin-top: 5px; overflow: hidden; }
  .rep-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #22c55e, #4ade80); }
  .rep-bar i.low { background: linear-gradient(90deg, #ef4444, #f87171); }
  .rep-bar i.mid { background: linear-gradient(90deg, #d4a44c, #facc15); }

  .toast {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%);
    background: rgba(15,23,42,.95); color: #fff; padding: 12px 18px; border-radius: 12px;
    border: 1px solid rgba(56,189,248,.5); font-size: 14px; z-index: 99; max-width: 84vw;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <button id="btnBack">‹</button>
    <div id="hdrTitle">时空法典</div>
    <button id="btnHome">🏠</button>
  </header>
  <main>
    <section id="vHome" class="view on"></section>
    <section id="vChapters" class="view"></section>
    <section id="vQuiz" class="view"></section>
    <section id="vResult" class="view"></section>
    <section id="vWrong" class="view"></section>
    <section id="vMock" class="view"></section>
    <section id="vCards" class="view"></section>
    <section id="vReport" class="view"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   时空法典 · 初二历史/道法期末冲刺
   数据区：CHAPTERS（章节）/ CARDS（知识卡）/ BANK（题库）
   ============================================================ */
/*BANK_START*/
const CHAPTERS = {
  h1: { subj: 'h', no: 1, title: '列强侵华与抗争', unit: '第一单元 · 中国开始沦为半殖民地半封建社会', desc: '鸦片战争 · 第二次鸦片战争 · 太平天国运动' },
  h2: { subj: 'h', no: 2, title: '近代化探索与民族危机', unit: '第二单元 · 近代化的早期探索与民族危机的加剧', desc: '洋务运动 · 甲午中日战争 · 戊戌变法 · 抗击八国联军' },
  h3: { subj: 'h', no: 3, title: '辛亥革命与中华民国', unit: '第三单元 · 资产阶级民主革命与中华民国的建立', desc: '革命先行者孙中山 · 辛亥革命 · 中华民国的创建 · 北洋政府' },
  h4: { subj: 'h', no: 4, title: '新民主主义革命的开始', unit: '第四单元 · 新民主主义革命的开始', desc: '新文化运动 · 五四运动 · 中国共产党诞生' },
  h5: { subj: 'h', no: 5, title: '从国共合作到国共对立', unit: '第五单元 · 从国共合作到国共对立', desc: '北伐战争 · 毛泽东开辟井冈山道路 · 中国工农红军长征' },
  h6: { subj: 'h', no: 6, title: '中华民族的抗日战争', unit: '第六单元 · 中华民族的抗日战争', desc: '九一八事变 · 七七事变 · 正面战场 · 敌后战场 · 抗战胜利' },
  h7: { subj: 'h', no: 7, title: '人民解放战争', unit: '第七单元 · 人民解放战争', desc: '重庆谈判 · 内战爆发 · 三大战役 · 渡江战役' },
  h8: { subj: 'h', no: 8, title: '近代经济与社会文化', unit: '第八单元 · 近代经济、社会生活与教育文化事业的发展', desc: '张謇实业救国 · 社会生活变化 · 教育文化事业' },
  d1: { subj: 's', no: 1, title: '走进社会生活', unit: '第一单元 · 走进社会生活', desc: '丰富的社会生活 · 网络生活新空间' },
  d2: { subj: 's', no: 2, title: '遵守社会规则', unit: '第二单元 · 遵守社会规则', desc: '社会生活离不开规则 · 社会生活讲道德 · 做守法的公民' },
  d3: { subj: 's', no: 3, title: '勇担社会责任', unit: '第三单元 · 勇担社会责任', desc: '责任与角色同在 · 积极奉献社会' },
  d4: { subj: 's', no: 4, title: '维护国家利益', unit: '第四单元 · 维护国家利益', desc: '国家利益至上 · 树立总体国家安全观 · 建设美好祖国' }
};
const CARDS = {
  h1: [
    ['🔥', '虎门销烟', '1839年6月3日至25日，林则徐在广东虎门海滩当众销毁鸦片110多万千克。虎门销烟是中国人民禁烟斗争的伟大胜利，显示了中华民族反抗外来侵略的坚强意志。'],
    ['📜', '《南京条约》', '1842年8月签订，中国近代史上第一个丧权辱国的不平等条约：割香港岛；赔款2100万银元；开放广州、厦门、福州、宁波、上海五处通商口岸；协定关税（英商进出口货物纳税须与英国协商）。'],
    ['⚔️', '第二次鸦片战争', '1856—1860年英法联军发动，根本目的是进一步打开中国市场。1860年火烧圆明园；沙俄趁机割占中国东北和西北150多万平方千米领土。中国半殖民地化程度进一步加深。'],
    ['🌾', '太平天国运动', '1851年金田起义，1853年定都天京（南京）。《天朝田亩制度》主张平均分配土地（空想性）；洪仁玕《资政新篇》主张向西方学习。1864年天京陷落，运动失败。']
  ],
  h2: [
    ['🔧', '洋务运动', '19世纪60—90年代中期，口号“自强”“求富”。代表人物：奕䜣、曾国藩、李鸿章、左宗棠、张之洞。创办江南机器制造总局、福州船政局等。是中国历史上第一次近代化运动，但未使中国走上富强道路，甲午战败标志其破产。'],
    ['🌊', '甲午中日战争', '1894—1895年。黄海海战中邓世昌（致远舰）壮烈殉国；威海卫战役北洋舰队全军覆没。《马关条约》：割辽东半岛、台湾全岛及所有附属各岛屿、澎湖列岛；赔款2亿两；开沙市、重庆、苏州、杭州；允许日本在通商口岸开设工厂（商品输出→资本输出）。大大加深中国半殖民地化程度。'],
    ['📖', '戊戌变法', '1895年公车上书（康有为、梁启超）拉开序幕；严复译《天演论》倡“物竞天择，适者生存”；1898年百日维新，因慈禧政变失败，谭嗣同等戊戌六君子遇害。在思想文化方面产生广泛而持久的影响。'],
    ['💥', '《辛丑条约》', '1901年签订：赔款白银4.5亿两；清政府保证严禁人民参加各种形式的反帝活动；拆毁大沽炮台、允许列强驻兵铁路沿线；划定东交民巷为使馆界。中国完全沦为半殖民地半封建社会。']
  ],

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

/* ==================== 音效 ==================== */
let AC = null;
function beep(freq, dur, type, vol) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol || 0.07, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
function sfx(kind) {
  if (kind === 'right') { beep(660, .09, 'triangle'); setTimeout(() => beep(880, .12, 'triangle'), 85); }
  else if (kind === 'wrong') beep(200, .2, 'sawtooth');
  else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .16, 'triangle'), i * 110));
  else beep(440, .05, 'square', .04);
}

function allOfSubj(s) {
  return Object.keys(BANK).filter(k => (CHAPTERS[k] || {}).subj === s)
    .reduce((acc, k) => acc.concat(BANK[k]), []);
}
function chapterKeys(s) { return Object.keys(CHAPTERS).filter(k => CHAPTERS[k].subj === s); }
function litOf(ch) {
  const c = save.chCorrect[ch] || 0;
  let n = 0;
  CARD_THRESHOLDS.forEach(t => { if (c >= t) n++; });
  return n;
}
function litTotal() {
  return Object.keys(CHAPTERS).reduce((a, k) => a + litOf(k), 0);
}
function starsOfSubj(s) {
  return chapterKeys(s).reduce((a, k) => a + (save.stars[k] || 0), 0);
}
function acc() {
  return save.stats.q ? Math.round(save.stats.right * 100 / save.stats.q) : 0;
}
function rankOf() {
  let r = RANKS[0];
  RANKS.forEach(x => { if (save.exp >= x.e) r = x; });
  return r;
}

/* ==================== 出题 ==================== */
function prepQ(q) {
  const c = Object.assign({ t: 'c' }, q);
  if (c.t === 's') {
    const idx = c.items.map((_, i) => i);
    c._order = shuffle(idx.slice());
    c._items = c._order.map(i => c.items[i]);
  } else if (c.t === 'j') {
    c._steps = c.steps.map(st => {
      const idx = st.o.map((_, i) => i);
      const sh = shuffle(idx.slice());
      return { q: st.q, o: sh.map(i => st.o[i]), a: sh.indexOf(st.a) };
    });
  } else {
    const idx = c.o.map((_, i) => i);
    const sh = shuffle(idx.slice());
    c._opts = sh.map(i => c.o[i]);
    c._ans = sh.indexOf(c.a);
  }
  return c;
}
function buildChapterQueue(ch) {
  const pool = BANK[ch].slice();
  const bosses = pool.filter(q => q.boss);
  const normal = pool.filter(q => !q.boss);
  let picked = shuffle(normal.slice()).slice(0, 6).concat(shuffle(bosses.slice()).slice(0, 2));
  if (picked.length < 8) {
    const rest = shuffle(normal.filter(q => picked.indexOf(q) < 0)).slice(0, 8 - picked.length);
    picked = picked.concat(rest);
  }
  return shuffle(picked);
}
function startChapter(ch) {
  state.chapter = ch;
  state.mode = 'chapter';
  state.wrongRun = false;
  state.queue = buildChapterQueue(ch).map(prepQ);
  state.qi = 0; state.right = 0; state.combo = 0; state.expGain = 0; state.answered = false;
  renderQuiz();
  show('vQuiz');
}

function renderBody(q) {

    body.innerHTML = q._opts.map((o, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${o}</button>`).join('');

    state._sortSel = [];

      q._items.map((it, i) => `<button class="chip" data-i="${i}">${it}</button>`).join('') +
      `<div class="orderline" id="orderLine">排序区：（点击事件放入）</div>
       <button class="btn primary" id="sortSubmit" disabled>提交排序</button>`;
    $$('#qBody .chip').forEach(b => {

        const i = parseInt(b.dataset.i, 10);
        const at = state._sortSel.indexOf(i);
        if (at >= 0) { state._sortSel.splice(at, 1); b.classList.remove('sel'); }
        else { state._sortSel.push(i); b.classList.add('sel'); }
        refreshOrderLine(q);
      };
    });
    $('#sortSubmit').onclick = () => { if (!state.answered) answer(state._sortSel.slice()); };
  } else if (q.t === 'j') {
    state._jSel = [];
    renderJStep(q, 0);
  }
}
function refreshOrderLine(q) {
  const sel = state._sortSel;
  const lbl = $('#orderLine');
  if (!lbl) return;
  lbl.textContent = sel.length
    ? '排序区：' + sel.map((k, i) => (i + 1) + '. ' + q._items[k]).join(' → ')
    : '排序区：（点击事件放入）';
  const sb = $('#sortSubmit');
  if (sb) sb.disabled = sel.length !== q._items.length;
}
function renderJStep(q, si) {
  const st = q._steps[si];
  const body = $('#qBody');
  body.innerHTML = `<div class="jstep">第 ${si + 1} / ${q._steps.length} 步 · ${st.q}</div>` +
    st.o.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  $$('#qBody .opt').forEach(b => b.onclick = () => {
    if (state.answered) return;
    const i = parseInt(b.dataset.i, 10);
    state._jSel[si] = i;
    $$('#qBody .opt').forEach(x => x.disabled = true);
    b.classList.add(i === st.a ? 'ok' : 'bad');
    setTimeout(() => {
      if (i === st.a && si + 1 < q._steps.length) renderJStep(q, si + 1);
      else answer(state._jSel.slice());
    }, 420);
  });
}

/* ==================== 判分与推进 ==================== */
function judge(q, resp) {
  if (q.t === 'c') return resp === q._ans;
  // 排序题：resp 是点击的显示序号序列，需映射回原始序号再校验
  if (q.t === 's') return resp.length === q._items.length && resp.map(k => q._order[k]).every((v, i) => v === i);
  if (q.t === 'j') return q._steps.every((st, i) => resp[i] === st.a);
  return false;
}
function answer(resp) {
  if (state.answered) return;
  state.answered = true;
  const q = state.queue[state.qi];
  const ok = judge(q, resp);
  if (ok) {
    state.right++;
    state.combo++;
    let gain = (q.boss ? 20 : 10) + (state.combo >= 3 ? 5 : 0);
    if (state.mode === 'mock') gain = 5;
    state.expGain += gain;
    save.exp += gain;
    sfx('right');
  } else {
    state.combo = 0;
    sfx('wrong');
  }
  save.stats.q++;
  if (ok) save.stats.right++;
  if (state.mode === 'chapter' || state.mode === 'mock') {
    if (!ok) {
      if (!save.wrong.some(w => w.id === q.id)) save.wrong.push({ id: q.id, streak: 0 });
    }
    if (state.mode === 'chapter') {
      save.chTotal[q.ch] = (save.chTotal[q.ch] || 0) + 1;
      if (ok) save.chCorrect[q.ch] = (save.chCorrect[q.ch] || 0) + 1;
    }
  }
  if (state.wrongRun) {
    const w = save.wrong.find(x => x.id === q.id);
    if (w) {
      if (ok) {
        w.streak = (w.streak || 0) + 1;
        if (w.streak >= 2) {
          save.wrong = save.wrong.filter(x => x.id !== q.id);
          toast('🎉 已从错题本毕业！');
        }
      } else w.streak = 0;
    }
  }
  persist();
  markQ(q, ok, resp);
  if (state.mode !== 'mock') showExplain(q, ok);
  const nb = $('#qNext');
  if (nb) nb.style.display = 'grid';
  const btn = $('#nextBtn');
  if (btn) btn.onclick = () => { sfx('click'); nextQ(); };
  if (state.mode === 'mock') {
    if (!ok && q.mat) { /* 模拟卷不显示解析 */ }
  }
}
function markQ(q, ok, resp) {
  if (q.t === 'c') {
    $$('#qBody .opt').forEach((b, i) => {
      b.disabled = true;
      if (i === q._ans) b.classList.add('ok');
      else if (i === resp) b.classList.add('bad');
    });
  } else if (q.t === 's') {
    const body = $('#qBody');
    body.innerHTML = `<div class="hint">${ok ? '✓ 排序正确' : '✗ 排序有误'} · 正确顺序：</div>
      <div class="order-final">${q.items.map((t, i) => `<span class="chip ok">${i + 1}. ${t}</span>`).join('')}</div>`;
  }
}
function showExplain(q, ok) {
  const box = $('#qExp');
  if (!box) return;
  let ansTxt = '';
  if (q.t === 'c') ansTxt = '正确答案：' + q._opts[q._ans];
  else if (q.t === 'j') ansTxt = '正确选择：' + q._steps.map((st, i) => st.o[st.a]).join(' → ');
  box.style.display = 'block';
  box.innerHTML = `${ok ? '✅ 答对了！' : '❌ 答错了。' + ansTxt}<br>${q.exp || ''}${q.k ? '<br><span class="kp">📌 知识点：' + q.k + '</span>' : ''}`;
}
function nextQ() {
  state.qi++;
  state.answered = false;
  state._sortSel = null;
  state._jSel = null;
  if (state.qi >= state.queue.length) return endRun();
  renderQuiz();
}
function endRun() {
  if (state.mode === 'mock') return finishMock();
  if (state.wrongRun) { renderResult(true); return; }
  const total = state.queue.length;
  const right = state.right;
  let st = 0;
  if (right === total) st = 3;
  else if (right >= total * 0.75) st = 2;
  else if (right >= total * 0.5) st = 1;
  if (st > (save.stars[state.chapter] || 0)) save.stars[state.chapter] = st;
  persist();
  state._stars = st;
  renderResult(false);
}
function renderResult(isWrongRun) {
  setHdr(isWrongRun ? '错题歼灭战' : '章节结算');
  const total = state.queue.length, right = state.right;
  let h = '';
  if (isWrongRun) {
    h = `<div class="res-box">
      <div class="res-title">🩹 歼灭战完成</div>
      <div class="res-main">答对 <b>${right}</b> / ${total}</div>
      <div class="res-sub">错题本剩余 ${save.wrong.length} 道 · 连续答对2次即可毕业</div>
      <div class="res-btns">
        <button class="btn" id="againBtn">再战一轮</button>
        <button class="btn primary" id="toChapters">返回首页</button>
      </div></div>`;
  } else {
    const st = state._stars || 0;
    h = `<div class="res-box">
      <div class="stars-big">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div>
      <div class="res-main">答对 <b>${right}</b> / ${total}</div>
      <div class="res-sub">+${state.expGain} 经验 · 该章知识卡点亮 ${litOf(state.chapter)}/4</div>
      <div class="res-btns">
        <button class="btn" id="againBtn">再来一次</button>
        <button class="btn primary" id="toChapters">返回章节</button>
      </div></div>`;
  }
  $('#vResult').innerHTML = h;
  $('#againBtn').onclick = () => {
    sfx('click');
    if (isWrongRun) startWrongRun();
    else startChapter(state.chapter);
  };
  $('#toChapters').onclick = () => {
    sfx('click');
    if (isWrongRun) { renderHome(); show('vHome'); }
    else { renderChapters(); show('vChapters'); }
  };
  show('vResult');
}

/* ==================== 错题本 ==================== */
function renderWrong() {
  setHdr('🩹 错题歼灭战');
  if (!save.wrong.length) {
    $('#vWrong').innerHTML = `<div class="empty-tip">🎉 错题本是空的！<br>答错的题会自动进来，连续答对 2 次即可毕业</div>`;
    return;
  }
  let h = `<div class="hint">共 ${save.wrong.length} 道错题 · 连续答对 2 次毕业 · 建议先看解析再做</div>`;
  save.wrong.forEach(w => {
    const q = byId(w.id);
    if (!q) return;
    const ans = q.t === 'c' ? q.o[q.a] : (q.t === 's' ? q.items.join(' → ') : (q.steps || []).map(st => st.o[st.a]).join(' → '));
    h += `<div class="wq-card">
      <div class="wq-ch">${CHAPTERS[q.ch] ? CHAPTERS[q.ch].title : ''} · ${q.k || ''}</div>
      <div class="wq-q">${q.q}</div>
      <div class="wq-a">✓ ${ans}</div>
    </div>`;
  });
  h += `<div style="margin-top:16px"><button class="btn primary" id="startBattle" style="width:100%">⚔️ 开始歼灭（${Math.min(save.wrong.length, 10)} 题）</button></div>`;
  $('#vWrong').innerHTML = h;
  $('#startBattle').onclick = () => { sfx('click'); startWrongRun(); };
}
function startWrongRun() {
  const items = shuffle(save.wrong.slice()).slice(0, 10).map(w => byId(w.id)).filter(Boolean);
  if (!items.length) { toast('错题本已清空！'); renderHome(); show('vHome'); return; }
  state.mode = 'wrong';
  state.wrongRun = true;
  state.queue = items.map(prepQ);
  state.qi = 0; state.right = 0; state.combo = 0; state.expGain = 0; state.answered = false;
  renderQuiz();
  show('vQuiz');
}

/* ==================== 模拟卷 ==================== */
const MOCKS = {
  h: { name: '📜 历史期末卷', desc: '选择题式组卷 · 25题 · 限时30分钟', n: 25, mins: 30, pool: () => allOfSubj('h').filter(q => (q.t || 'c') === 'c') },
  s: { name: '⚖️ 道法期末卷', desc: '选择题式组卷 · 20题 · 限时30分钟', n: 20, mins: 30, pool: () => allOfSubj('s').filter(q => (q.t || 'c') === 'c') },
  both: { name: '🗂️ 双科联考卷', desc: '历史15 + 道法15 · 限时45分钟', n: 30, mins: 45, pool: null }
};
function renderMock() {
  setHdr('🎯 期末全真模拟卷');
  let h = `<div class="hint">按期末卷客观题结构组卷，交卷自动判分并定位薄弱点（错题自动进错题本）</div>`;
  ['h', 's', 'both'].forEach(k => {
    const m = MOCKS[k];
    const best = save.mockBest[k] || 0;
    h += `<button class="mock-card" data-k="${k}">
      <div class="mc-title">${m.name}</div>
      <div class="mc-desc">${m.desc}</div>
      <div class="mc-best">${best ? '历史最佳：' + best + ' 分' : '尚未挑战'}</div>
    </button>`;
  });
  $('#vMock').innerHTML = h;
  $$('#vMock .mock-card').forEach(el => el.onclick = () => { sfx('click'); startMock(el.dataset.k); });
}
function startMock(kind) {
  const m = MOCKS[kind];
  let pool;
  if (kind === 'both') {
    pool = shuffle(allOfSubj('h').filter(q => (q.t || 'c') === 'c').slice()).slice(0, 15)
      .concat(shuffle(allOfSubj('s').filter(q => (q.t || 'c') === 'c').slice()).slice(0, 15));
  } else {
    pool = shuffle(m.pool().slice()).slice(0, m.n);
  }
  state.mode = 'mock';
  state.wrongRun = false;
  state.chapter = null;
  state.queue = pool.map(prepQ);
  state.qi = 0; state.right = 0; state.combo = 0; state.expGain = 0; state.answered = false;
  state.mock = { kind: kind, total: pool.length, timeLeft: m.mins * 60 };
  clearInterval(state.mock.timer);
  state.mock.timer = setInterval(() => {
    if (!state.mock) return;
    state.mock.timeLeft--;
    updateTimerLabel();
    if (state.mock.timeLeft <= 0) { clearInterval(state.mock.timer); toast('⏰ 时间到，自动交卷'); finishMock(); }
  }, 1000);
  renderQuiz();
  show('vQuiz');
}
function updateTimerLabel() {
  const el = $('#mockTimer');
  if (!el || !state.mock) return;
  const t = Math.max(0, state.mock.timeLeft);
  el.textContent = '⏱ ' + pad(Math.floor(t / 60)) + ':' + pad(t % 60);
}
function finishMock() {
  if (state.mock && state.mock.timer) clearInterval(state.mock.timer);
  const total = state.queue.length;
  const right = state.right;
  const score = total ? Math.round(right * 100 / total) : 0;
  const kind = state.mock ? state.mock.kind : 'h';
  if (score > (save.mockBest[kind] || 0)) save.mockBest[kind] = score;
  persist();
  setHdr('📋 模拟卷成绩单');
  const grade = score >= 90 ? 'A · 优秀' : score >= 75 ? 'B · 良好' : score >= 60 ? 'C · 及格' : 'D · 待加强';
  let h = `<div class="res-box">
    <div class="res-title">${MOCKS[kind].name}</div>
    <div class="stars-big" style="font-size:34px">${score} 分</div>
    <div class="res-main">答对 <b>${right}</b> / ${total} · 评级 ${grade}</div>
    <div class="res-sub">错题已自动进入错题本 · 最佳纪录 ${save.mockBest[kind]} 分</div>
    <div class="res-btns">
      <button class="btn" id="againBtn">再考一次</button>
      <button class="btn primary" id="toHome">返回首页</button>
    </div></div>`;
  $('#vResult').innerHTML = h;
  $('#againBtn').onclick = () => { sfx('click'); startMock(kind); };
  $('#toHome').onclick = () => { sfx('click'); renderHome(); show('vHome'); };
  state.mock = null;
  show('vResult');
}

/* ==================== 知识速记手册 ==================== */
function renderCards() {
  setHdr('📚 知识速记手册');
  const s = state.cardsSubj;
  let h = `<div class="subject-tabs">
    <button data-s="h" class="${s === 'h' ? 'on' : ''}">📜 历史 · 速记卡</button>
    <button data-s="s" class="${s === 's' ? 'on' : ''}">⚖️ 道法 · 速记卡</button>
  </div>`;
  chapterKeys(s).forEach(k => {
    const c = CHAPTERS[k];
    const cards = CARDS[k] || [];
    const lit = litOf(k);
    h += `<div class="sec-title">${c.no}. ${c.title} <span style="color:#64748b;font-weight:400;font-size:11px">（点亮 ${lit}/${cards.length}）</span></div>`;
    cards.forEach((cd, i) => {
      const isLit = i < lit;
      h += `<div class="kcard ${isLit ? 'lit' : ''}">
        <div class="kc-top"><span>${cd[0]}</span><span>${cd[1]}</span><span class="kc-badge">${isLit ? '★ 已点亮' : '☆ 待点亮'}</span></div>
        <div class="kc-text">${cd[2]}</div>
      </div>`;
    });
  });
  h += `<div class="hint" style="margin-top:16px">💡 点亮规则：该章累计答对 5 / 10 / 15 / 20 题依次点亮 4 张卡</div>`;
  $('#vCards').innerHTML = h;
  $$('#vCards .subject-tabs button').forEach(b => b.onclick = () => { sfx('click'); state.cardsSubj = b.dataset.s; renderCards(); });
}

/* ==================== 学习报告 ==================== */
function renderReport() {
  setHdr('📊 学习报告');
  const r = rankOf();
  let h = `<div class="hero" style="padding:18px">
    <div class="rank-row" style="margin-top:0">${r.i} <b>${r.n}</b> · 经验 <b>${save.exp}</b></div>
  </div>
  <div class="stat-row">
    <div class="stat-cell"><b>${acc()}%</b><span>总正确率</span></div>
    <div class="stat-cell"><b>${save.stats.q}</b><span>累计练习</span></div>
    <div class="stat-cell"><b>${save.wrong.length}</b><span>待歼灭错题</span></div>
  </div>`;
  ['h', 's'].forEach(s => {
    h += `<div class="sec-title">${SUBJ[s].icon} ${SUBJ[s].name}线 · 各章正确率</div>`;
    chapterKeys(s).forEach(k => {
      const c = CHAPTERS[k];
      const cc = save.chCorrect[k] || 0, ct = save.chTotal[k] || 0;
      const rate = ct ? Math.round(cc * 100 / ct) : 0;
      const cls = !ct ? '' : rate >= 80 ? '' : rate >= 60 ? 'mid' : 'low';
      h += `<div class="rep-row">
        <div class="rep-head"><span>${c.no}. ${c.title}</span><b>${ct ? rate + '%（' + cc + '/' + ct + '）' : '未练习'}</b></div>
        <div class="rep-bar"><i class="${cls}" style="width:${rate}%"></i></div>
      </div>`;
    });
  });
  h += `<div class="sec-title">🎯 模拟卷最佳成绩</div>`;
  ['h', 's', 'both'].forEach(k => {
    h += `<div class="rep-row"><div class="rep-head"><span>${MOCKS[k].name}</span><b>${(save.mockBest[k] || 0) + ' 分'}</b></div></div>`;
  });
  $('#vReport').innerHTML = h;
}

/* ==================== 导航 ==================== */
function goHome() {
  if (state.view === 'quiz' && state.mock && state.mock.timer) clearInterval(state.mock.timer);
  state.mock = null;
  renderHome();
  show('vHome');
}
$('#btnHome').onclick = () => { sfx('click'); goHome(); };
$('#btnBack').onclick = () => {
  sfx('click');
  const v = state.view;
  if (v === 'home') return;
  if (v === 'quiz' || v === 'result') {
    if (state.mock && state.mock.timer) clearInterval(state.mock.timer);
    state.mock = null;
    if (state.mode === 'chapter' && state.chapter) { renderChapters(); show('vChapters'); }
    else { renderHome(); show('vHome'); }
    return;
  }
  if (v === 'chapters' || v === 'wrong' || v === 'mock' || v === 'cards' || v === 'report') {
    renderHome(); show('vHome');
  }
};

/* ==================== 启动 ==================== */
renderHome();
</script>
</body>
</html>
