<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>祖玛小游戏 · 彩球消除闯关</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1000px 600px at 50% -10%, #2d3a5a 0%, #0f172a 55%, #070b16 100%);
    color: #e8eefc;
    padding: 12px;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    width: min(94vw, 520px);
    aspect-ratio: 1 / 1;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 14px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .stat {
    display: flex;
    gap: 10px;
  }
  .pill {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    padding: 4px 10px;
    font-size: 13px;
  }
  .pill .val { color: #ffd76e; }
  .next-ball-dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 8px rgba(0,0,0,0.45);
    margin-left: 6px;
    vertical-align: middle;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.18); opacity: 0.75; }
  }
  .aim-dot {
    position: absolute;
    width: 10px; height: 10px;
    background: #ffd76e;
    border-radius: 50%;
    box-shadow: 0 0 12px #ffd76e, 0 0 20px rgba(255,215,110,0.6);
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .aim-dot.visible { opacity: 1; }
  .hud-center {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hud-center.show { opacity: 1; }
  .big-text { font-size: 42px; font-weight: 900; letter-spacing: 6px; color: #ffd76e; text-shadow: 0 0 24px rgba(255,215,110,0.5); margin-bottom: 6px; }
  .small-text { font-size: 16px; color: #c7d2fe; }
  .controls-hint {
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #9db1d6; pointer-events: none; opacity: 0.8;
    transition: opacity 1.2s ease;
  }
  .controls-hint.fade { opacity: 0; }
  /* 覆盖层：开始/暂定/结算 */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(7, 11, 22, 0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 40;
    border-radius: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 40px; margin-bottom: 10px; letter-spacing: 4px; color: #ffd76e; text-shadow: 0 0 20px rgba(255,215,110,0.4); }
  .overlay p { color: #c7d2fe; margin-bottom: 22px; font-size: 15px; text-align: center; line-height: 1.6; }
  .btn {
    padding: 12px 26px; font-size: 16px; font-weight: 800; color: #0f172a;
    background: linear-gradient(180deg, #ffd76e, #f59e0b);
    border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 18px rgba(245,158,11,0.45);
    transition: transform 0.1s, filter 0.1s;
  }
  .btn:active { transform: scale(0.96); filter: brightness(1.1); }
  .btn.outline {
    background: transparent; color: #ffd76e; border: 1.5px solid #ffd76e; box-shadow: none; margin-left: 14px;
  }
  .level-list {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; width: 260px;
  }
  .lv-btn {
    padding: 8px 4px; font-size: 13px; font-weight: 700; border-radius: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: #c7d2fe; cursor: pointer;
  }
  .lv-btn.active { background: #ffd76e; color: #0f172a; border-color: #ffd76e; }
  .lv-btn.locked { opacity: 0.5; cursor: not-allowed; }
  .key-hint {
    margin-top: 10px; font-size: 12px; color: #8fa3c8; text-align: center;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="gameCanvas"></canvas>
  <div class="aim-dot" id="aimDot"></div>

  <div class="ui">
    <div class="top-bar">
      <div class="stat">
        <div class="pill">关卡 <span class="val" id="levelText">1</span>/<span class="val" id="levelTotal">64</span></div>
        <div class="pill">分数 <span class="val" id="scoreText">0</span></div>
        <div class="pill">剩余 <span class="val" id="remainText">0</span></div>
        <div class="pill">下一球 <span class="val" id="nextColor" style="color:transparent"></span><span class="next-ball-dot" id="nextColorDot"></span></div>
      </div>
      <div class="pill" id="statusText">准备中</div>
    </div>
    <div class="hud-center" id="hudCenter">
      <div class="big-text" id="hudBig">准备</div>
      <div class="small-text" id="hudSmall">点击屏幕发射彩球</div>
    </div>
    <div class="controls-hint" id="controlsHint">👆 点击屏幕任意位置，发射底部当前球 · 击中同色球串，连续 3 个及以上消除 · 阻止球滚入终点洞穴</div>
  </div>

  <div class="overlay hidden" id="overlayStart">
    <h2>🌀 祖玛消除</h2>
    <p>用发射器击中同色球串，<br>连续 3 个及以上即可消除！<br>不要让任何彩球滚入终点洞穴。</p>
    <button class="btn" onclick="startGame(1)">开始闯关</button>
    <div class="level-list" id="levelList"></div>
    <div class="key-hint">已解锁关卡显示高亮，点击即可挑战</div>
  </div>

  <div class="overlay hidden" id="overlayPause">
    <h2>⏸ 暂停</h2>
    <button class="btn" onclick="resumeGame()">继续游戏</button>
    <button class="btn outline" onclick="backToStart()">返回主菜单</button>
  </div>

  <div class="overlay hidden" id="overlayWin">
    <h2>🎉 关卡完成！</h2>
    <p id="winMsg">所有彩球已消除</p>
    <button class="btn" onclick="nextLevel()">下一关</button>
    <button class="btn outline" onclick="backToStart()">返回主菜单</button>
  </div>

  <div class="overlay hidden" id="overlayLose">
    <h2>💥 游戏失败</h2>
    <p id="loseMsg">彩球滚入了终点洞穴</p>
    <button class="btn" onclick="restartLevel()">重试本关</button>
    <button class="btn outline" onclick="backToStart()">返回主菜单</button>
  </div>
</div>

<script>
/* ==================== 配置常量 ==================== */
const COLORS = [
  '#e8323c', // 红
  '#fdd028', // 黄（柠檬明黄，与红橙彻底拉开）
  '#3fd44f', // 绿（亮翠绿）
  '#2f6df6', // 蓝
  '#9d3bf0', // 紫
  '#f2f6f5', // 白（全色系里区分度最高）
  '#14c8c8', // 青（与蓝紫拉开）
];
const BALL_R = 10;           // 球半径
const BALL_GAP = 20;         // 球中心间距
const SHOOT_SPEED = 9;       // 发射球速度
const CHAIN_SPEED_BASE = 0.55;// 球串基础速度（每帧像素）
const FRICTION = 0.92;       // 插入后球串收紧摩擦
const CANVAS_PAD = 40;       // 画布边距

let W, H;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/* ==================== 状态 ==================== */
let state = 'MENU'; // MENU, PLAYING, PAUSED, WIN, LOSE
let levelIndex = 0;      // 0-based
let score = 0;
let unlockedLevel = 0;   // 0-based，已解锁最大关
let levelData = null;
let chain = [];          // 球串数组，每个元素 {t, color, r}
let shooter = null;      // {x, y, angle, color, ball:{x,y,vx,vy,active,color}}
let aim = {x: 0, y: 0, active: false};
let animFrame = null;
let lastTime = 0;

/* ==================== 关卡定义（64关，程序化生成） ====================
   8章 x 8关 = 64关，难度递增：颜色 3→7 色，球数 24→120，速度 1.0→2.5
   path: 路径控制点数组 [{x,y}, ...]，球从 path[0] 出发，向 path[end] 终点滚动
   colors: 可出现的颜色索引数组
   ballCount: 初始球串长度
   speedMultiplier: 速度系数
   spawnInterval: 新球生成间隔（帧），0 表示不自动生成（固定球串）
*/
const CHAPTERS = [
  { name: '草原',    colorCount: 3 },
  { name: '森林',    colorCount: 4 },
  { name: '沙漠',    colorCount: 4 },
  { name: '冰川',    colorCount: 5 },
  { name: '火山',    colorCount: 5 },
  { name: '丛林',    colorCount: 6 },
  { name: '星空',    colorCount: 6 },
  { name: '祖玛终焉', colorCount: 7 },
];

// 路径生成器：type 0~7，返回控制点数组（归一化坐标 0~1）
function pathByType(type, cx, cy) {
  const p = [];
  switch (type) {
    case 0: // 蛇形三横（入门）
      p.push({x:0.06,y:0.88},{x:0.88,y:0.88},{x:0.88,y:0.72},{x:0.12,y:0.72},{x:0.12,y:0.56},{x:0.88,y:0.56},
             {x:0.88,y:0.40},{x:0.12,y:0.40},{x:0.12,y:0.24},{x:0.86,y:0.24},{x:0.86,y:0.10},{x:0.93,y:0.10});
      break;
    case 1: // 反向蛇形
      p.push({x:0.94,y:0.88},{x:0.12,y:0.88},{x:0.12,y:0.72},{x:0.88,y:0.72},{x:0.88,y:0.56},{x:0.12,y:0.56},
             {x:0.12,y:0.40},{x:0.88,y:0.40},{x:0.88,y:0.24},{x:0.14,y:0.24},{x:0.14,y:0.10},{x:0.07,y:0.10});
      break;
    case 2: // 大回环 S
      p.push({x:0.06,y:0.90},{x:0.50,y:0.90},{x:0.50,y:0.72},{x:0.12,y:0.72},{x:0.12,y:0.54},{x:0.62,y:0.54},
             {x:0.62,y:0.72},{x:0.88,y:0.72},{x:0.88,y:0.38},{x:0.30,y:0.38},{x:0.30,y:0.20},{x:0.72,y:0.20},
             {x:0.72,y:0.10},{x:0.92,y:0.10});
      break;
    case 3: // 双 U 回环
      p.push({x:0.50,y:0.08},{x:0.50,y:0.30},{x:0.88,y:0.30},{x:0.88,y:0.48},{x:0.12,y:0.48},{x:0.12,y:0.66},
             {x:0.88,y:0.66},{x:0.88,y:0.84},{x:0.35,y:0.84},{x:0.35,y:0.70},{x:0.60,y:0.70},{x:0.60,y:0.88},
             {x:0.90,y:0.88},{x:0.94,y:0.92});
      break;
    case 4: // 大螺旋
      return spiralPath(cx, cy, 0.44, 3.6);
    case 5: // 密集波浪
      p.push({x:0.06,y:0.30},{x:0.30,y:0.30},{x:0.30,y:0.14},{x:0.55,y:0.14},{x:0.55,y:0.30},{x:0.80,y:0.30},
             {x:0.80,y:0.46},{x:0.20,y:0.46},{x:0.20,y:0.62},{x:0.80,y:0.62},{x:0.80,y:0.78},{x:0.20,y:0.78},
             {x:0.20,y:0.92},{x:0.90,y:0.92});
      break;
    case 6: // 回字迷宫
      p.push({x:0.10,y:0.14},{x:0.85,y:0.14},{x:0.85,y:0.30},{x:0.25,y:0.30},{x:0.25,y:0.45},{x:0.85,y:0.45},
             {x:0.85,y:0.60},{x:0.25,y:0.60},{x:0.25,y:0.75},{x:0.85,y:0.75},{x:0.85,y:0.90},{x:0.30,y:0.90},
             {x:0.30,y:0.82},{x:0.60,y:0.82},{x:0.60,y:0.92},{x:0.93,y:0.92});
      break;
    case 7: // 复杂交叉长径
      p.push({x:0.06,y:0.85},{x:0.32,y:0.85},{x:0.32,y:0.52},{x:0.68,y:0.52},{x:0.68,y:0.20},{x:0.90,y:0.20},
             {x:0.90,y:0.36},{x:0.48,y:0.36},{x:0.48,y:0.68},{x:0.14,y:0.68},{x:0.14,y:0.52},{x:0.32,y:0.52},
             {x:0.32,y:0.90},{x:0.90,y:0.90},{x:0.94,y:0.92});
      break;
  }
  return p;
}

function spiralPath(cx, cy, r, turns) {
  const pts = [];
  const segments = 70;
  for (let i = 0; i <= segments; i++) {
    const u = i / segments;
    const angle = u * turns * 2 * Math.PI;
    const rad = r * (1 - u * 0.5);
    pts.push({x: cx + Math.cos(angle) * rad, y: cy + Math.sin(angle) * rad * 0.85});
  }
  pts.push({x: 0.92, y: 0.10});
  return pts;
}

// 生成全部64关
const LEVELS = (() => {
  const levels = [];
  const total = 64;
  for (let i = 0; i < total; i++) {
    const chapter = Math.floor(i / 8);
    const stage   = i % 8;
    const ch = CHAPTERS[chapter];
    const pathType = (chapter * 3 + stage) % 8;
    const cx = 0.45 + (stage % 3 - 1) * 0.12;
    const cy = 0.50 + Math.floor(stage / 3) * 0.10;
    const path = pathByType(pathType, cx, cy);
    const colorCount = Math.min(ch.colorCount + Math.floor(stage / 4), 7);
    const colors = [];
    for (let c = 0; c < colorCount; c++) colors.push(c);
    const ballCount = Math.round(24 + (i / (total - 1)) * 96);
    const speedMultiplier = 1.0 + (i / (total - 1)) * 1.5;
    levels.push({
      name: `${ch.name}·第 ${stage + 1} 阶`,
      path, colors, ballCount, speedMultiplier, spawnInterval: 0
    });
  }
  return levels;
})();

/* ==================== 工具函数 ==================== */
function resize() {
  const wrap = document.getElementById('game-wrap');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(rect.width, rect.height);
  W = size; H = size;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  // 逻辑坐标（CSS 像素）× dpr = 物理像素，内容铺满整个画布
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 重新放置发射器在画布下方居中
  if (shooter) {
    shooter.x = W / 2;
    shooter.y = H - 92;
  }
  initBackground(); // 依据新尺寸重算火把位置
  if (levelData) drawFrame();
}

// 路径点按比例转换到画布像素
function pathPoint(p) {
  return { x: p.x * W, y: p.y * H };
}

// 沿路径累积长度，用于 t -> 像素位置的映射
function buildPathLengths(path) {
  const len = [0];
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const a = pathPoint(path[i - 1]);
    const b = pathPoint(path[i]);
    total += Math.hypot(b.x - a.x, b.y - a.y);
    len.push(total);
  }
  return { lengths: len, total };
}

// t (0~1) -> 路径上的像素点
function tToPoint(path, lengths, t) {
  t = Math.max(0, Math.min(1, t));
  const target = t * lengths.total;
  // 二分找区间
  let lo = 0, hi = lengths.lengths.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (lengths.lengths[mid] < target) lo = mid + 1; else hi = mid;
  }
  const seg = Math.max(0, Math.min(lo - 1, lengths.lengths.length - 2));
  const segStart = lengths.lengths[seg];
  const segEnd = lengths.lengths[seg + 1];
  const u = segEnd === segStart ? 0 : (target - segStart) / (segEnd - segStart);
  const a = pathPoint(path[seg]);
  const b = pathPoint(path[seg + 1]);
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, seg };
}

// 方向向量（沿路径前进方向）在 t 处
function tToDir(path, lengths, t) {
  t = Math.max(0, Math.min(1, t));
  const eps = 0.002;
  const p1 = tToPoint(path, lengths, Math.max(0, t - eps));
  const p2 = tToPoint(path, lengths, Math.min(1, t + eps));
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const d = Math.hypot(dx, dy) || 1;
  return { x: dx / d, y: dy / d };
}

/* ==================== 游戏核心 ==================== */
function initLevel(idx) {
  levelIndex = idx;
  levelData = LEVELS[idx];
  const { path } = levelData;
  levelData._lengths = buildPathLengths(path);

  // 初始球串：从入口（t=0）沿路径排布，领先球在最前端，随时间滚向骷髅洞（t=1）
  // chain[0] 是领先球（最靠近终点）
  chain = [];
  const total = levelData._lengths.total;
  // 领先球初始位置：球串末端刚好贴住入口，给玩家整条路径长度的反应时间
  const headT = Math.min(0.32, (levelData.ballCount * BALL_GAP) / total);
  // 道具系统：第 5 关(levelIndex>=4)起随机埋道具球，关卡越深越多
  const powerTypes = ['bomb', 'lightning', 'freeze', 'rewind'];
  const pwCount = levelIndex >= 4 ? Math.min(4, 2 + Math.floor((levelIndex - 4) / 8)) : 0;
  const pwSlots = new Set();
  let guard = 0;
  while (pwSlots.size < pwCount && guard++ < 60) {
    const pos = 6 + Math.floor(Math.random() * (levelData.ballCount - 10));
    pwSlots.add(pos); // 避开入口前几球，埋在中后段
  }
  for (let i = 0; i < levelData.ballCount; i++) {
    const t = Math.max(0, headT - (i * BALL_GAP) / total);
    const col = levelData.colors[Math.floor(Math.random() * levelData.colors.length)];
    const ball = { t, color: col, r: BALL_R };
    if (pwSlots.has(i)) ball.power = powerTypes[Math.floor(Math.random() * powerTypes.length)];
    chain.push(ball);
  }

  // 发射器
  shooter = {
    x: W / 2, y: H - 92,
    angle: -Math.PI / 2,
    color: levelData.colors[Math.floor(Math.random() * levelData.colors.length)],
    ball: null // {x,y,vx,vy,color,active}
  };

  score = 0;
  freezeT = 0;
  queueTrigger = [];
  aim.active = false;
  document.getElementById('aimDot').classList.remove('visible');
  const hint = document.getElementById('controlsHint');
  if (hint) hint.classList.add('fade');
  updateHud();

  setState('PLAYING');
}

function setState(s) {
  state = s;
  const st = document.getElementById('statusText');
  const ov = (id) => document.getElementById(id);
  ov('overlayStart').classList.add('hidden');
  ov('overlayPause').classList.add('hidden');
  ov('overlayWin').classList.add('hidden');
  ov('overlayLose').classList.add('hidden');

  if (s === 'PLAYING') {
    st.textContent = '游戏中';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  } else if (s === 'PAUSED') {
    st.textContent = '已暂停';
    ov('overlayPause').classList.remove('hidden');
  } else if (s === 'WIN') {
    st.textContent = '通关';
    ov('overlayWin').classList.remove('hidden');
    document.getElementById('winMsg').textContent = `第 ${levelIndex + 1} 关：${levelData.name} 已完成`;
  } else if (s === 'LOSE') {
    st.textContent = '失败';
    ov('overlayLose').classList.remove('hidden');
    document.getElementById('loseMsg').textContent = `第 ${levelIndex + 1} 关：${levelData.name} 被突破了`;
  } else if (s === 'MENU') {
    st.textContent = '主菜单';
    ov('overlayStart').classList.remove('hidden');
    renderLevelList();
  }
}

function loop(now) {
  if (state !== 'PLAYING') return;
  const dt = Math.min((now - lastTime) / 16.67, 3); // 归一化到 ~60fps
  lastTime = now;

  update(dt);
  updateEffects();
  drawFrame();
  animFrame = requestAnimationFrame(loop);
}

function update(dt) {
  const { path, speedMultiplier } = levelData;
  const lengths = levelData._lengths;
  const speed = CHAIN_SPEED_BASE * speedMultiplier;

  // 1. 移动球串：领先球先走，后面球按间距跟随
  if (chain.length > 0) {
    if (freezeT > 0) {
      freezeT -= dt; // ❄️ 冰冻中：球链完全停止，但仍发射与消除
      updateHud();
      return;
    }
    chain[0].t += speed * dt / lengths.total;
    // 终点判定
    if (chain[0].t >= 1.0) {
      // 骷髅吞噬特效 + 音效
      const endPos = tToPoint(path, lengths, 1.0);
      spawnBurst(endPos.x, endPos.y, '#b8ffb8', 26, 1.8);
      spawnFloatText(endPos.x, endPos.y - 30, '球入骷髅口！', '#ff6b6b', 22);
      playSfx('skull');
      setState('LOSE');
      return;
    }
    // 后面球：保持与前面球的距离 BALL_GAP（沿路径弧长）
    for (let i = 1; i < chain.length; i++) {
      const prev = chain[i - 1];
      const cur = chain[i];
      // 当前球在路径上的弧长位置
      const curPos = tToPoint(path, lengths, cur.t);
      const prevPos = tToPoint(path, lengths, prev.t);
      const d = Math.hypot(prevPos.x - curPos.x, prevPos.y - curPos.y);
      if (d > BALL_GAP) {
        // 需要向前追：沿路径前进
        const dir = tToDir(path, lengths, cur.t);
        const step = Math.min(d - BALL_GAP, speed * dt * 1.2);
        cur.t += step / lengths.total;
        if (cur.t > 1) cur.t = 1;
      }
    }
  }

  // 2. 移动发射出的球
  if (shooter.ball && shooter.ball.active) {
    const b = shooter.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // 撞墙反弹（画布边缘）
    if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; }
    if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; }
    if (b.y + b.r > H) {
      // 掉出底部则销毁
      shooter.ball.active = false;
      shooter.ball = null;
    }

    // 与球串碰撞
    if (shooter.ball && shooter.ball.active) {
      checkShotHit();
    }
  }

  // 3. 插入后收紧：把间距过大的球往前压
  tightenChain();

  updateHud();
}

// 发射球与球串碰撞：找最近的球，插入
function checkShotHit() {
  const b = shooter.ball;
  let hitIdx = -1;
  let hitDist = Infinity;
  let hitT = 0;
  let hitSide = 0; // -1 插入到该球前面，1 插入到该球后面

  for (let i = 0; i < chain.length; i++) {
    const c = chain[i];
    const p = tToPoint(levelData.path, levelData._lengths, c.t);
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    const minD = b.r + c.r + 4; // 4 像素容差
    if (d < minD && d < hitDist) {
      hitDist = d;
      hitIdx = i;
      hitT = c.t;
      // 判断发射球是在该球的前方还是后方（沿路径方向）
      const dir = tToDir(levelData.path, levelData._lengths, c.t);
      const toBall = { x: b.x - p.x, y: b.y - p.y };
      const dot = toBall.x * dir.x + toBall.y * dir.y;
      hitSide = dot > 0 ? 1 : -1;
    }
  }

  if (hitIdx !== -1) {
    // 命中特效：插入点爆闪光 + 音效
    const hitPos = tToPoint(levelData.path, levelData._lengths, hitT);
    spawnBurst(hitPos.x, hitPos.y, b.color, 8, 0.85);
    playSfx('hit');

    // 🎯 命中道具球：触发效果（不插入）
    if (chain[hitIdx].power) {
      const pw = chain[hitIdx].power;
      chain.splice(hitIdx, 1);
      shooter.ball.active = false;
      shooter.ball = null;
      queueTrigger.push({ idx: hitIdx, type: pw });
      processTriggerQueue();
      // 防死局：从链上现存颜色换弹
      shooter.color = pickLivingColor();
      updateHud();
      return;
    }

    insertShot(hitIdx, hitSide, b.color);
    shooter.ball.active = false;
    shooter.ball = null;
    // 换下一颗发射球颜色（只从链上现存颜色中选，防死局）
    shooter.color = pickLivingColor();
    updateHud();
  }
}

// 将发射的球插入球串
function insertShot(idx, side, color) {
  // 计算新球的 t：插入到被击球的前面或后面
  let newT;
  if (side > 0) {
    // 插入到 hitIdx 后面（远离终点方向）
    newT = Math.max(0, chain[idx].t - BALL_GAP / levelData._lengths.total);
  } else {
    // 插入到 hitIdx 前面（靠近终点方向）
    newT = Math.min(1, chain[idx].t + BALL_GAP / levelData._lengths.total);
  }
  // 防止与相邻球重叠过度：向外调整
  if (side > 0 && idx > 0) {
    const gap = chain[idx].t - newT;
    if (gap < BALL_GAP * 0.6 / levelData._lengths.total) newT = chain[idx].t - BALL_GAP * 0.6 / levelData._lengths.total;
  }
  if (side <= 0 && idx < chain.length - 1) {
    const gap = newT - chain[idx + 1].t;
    if (gap < BALL_GAP * 0.6 / levelData._lengths.total) newT = chain[idx + 1].t + BALL_GAP * 0.6 / levelData._lengths.total;
  }

  chain.splice(idx + (side > 0 ? 1 : 0), 0, { t: newT, color, r: BALL_R });

  // 消除检测：从新球所在位置向两边扩散
  const insertIndex = idx + (side > 0 ? 1 : 0);
  resolveMatches(insertIndex);
}

// 消除与连锁
function resolveMatches(startIndex) {
  let changed = true;
  let idx = startIndex;
  let chainDepth = 0;   // 连锁层数
  while (changed && chain.length > 0) {
    changed = false;
    // 从 idx 所在球开始，向左右找同色连续段
    const center = Math.max(0, Math.min(idx, chain.length - 1));
    const color = chain[center].color;
    let left = center;
    while (left > 0 && chain[left - 1].color === color) left--;
    let right = center;
    while (right < chain.length - 1 && chain[right + 1].color === color) right++;
    const count = right - left + 1;
    if (count >= 3) {
      // 记录消除位置（用于爆炸特效）
      const path = levelData.path;
      const lengths = levelData._lengths;
      const midIdx = Math.floor((left + right) / 2);
      const midBall = chain[Math.min(midIdx, chain.length - 1)];
      const midPos = tToPoint(path, lengths, midBall.t);

      // 🎁 消除组内的道具球 → 收集进触发队列（组消除后依次引爆）
      for (let k = left; k <= right; k++) {
        if (chain[k] && chain[k].power && k !== midIdx) {
          queueTrigger.push({ idx: k, type: chain[k].power, removeOnly: true });
        }
      }

      // 加分（连锁层数越高，倍率越大）
      chainDepth++;
      const baseScore = count * 10 + (count - 3) * 5;
      const mult = 1 + (chainDepth - 1) * 0.5;
      const gained = Math.round(baseScore * mult);
      score += gained;

      // 连击计数
      comboCount++;
      comboTimer = 90;

      // 爆炸粒子（每个被消除的球都炸）
      for (let k = left; k <= right; k++) {
        const b = chain[k];
        if (!b) continue;
        const pos = tToPoint(path, lengths, b.t);
        spawnBurst(pos.x, pos.y, b.color, 10, 1);
      }
      // 中心大闪光
      spawnBurst(midPos.x, midPos.y, color, 18, 1.4);

      // 飘字
      spawnFloatText(midPos.x, midPos.y - 18, '+' + gained, '#ffd76e', 22);
      if (chainDepth >= 2) {
        spawnFloatText(midPos.x, midPos.y - 44, '连锁 x' + chainDepth + '!', '#ff9d5c', 20);
        playSfx('combo');
      } else if (comboCount >= 2) {
        spawnFloatText(midPos.x, midPos.y - 44, '连击 x' + comboCount, '#7ee0a3', 18);
      }
      playSfx('pop');

      // 删除这段
      chain.splice(left, right - left + 1);
      changed = true;
      // 连锁：删除后，left-1 和 left（原 right+1）相邻，检查它们是否同色
      idx = Math.max(0, left - 1);
      if (idx >= chain.length) idx = chain.length - 1;
      // 如果两端同色，下一次循环会再次从 idx 扩展检测
    }
  }
  // 防死局：手球颜色若已在链上清光，自动换成现存颜色
  if (chain.length && !livingColors().includes(shooter.color)) {
    shooter.color = pickLivingColor();
    updateHud();
  }
  updateHud();
  // 处理道具触发队列（可能连锁引爆更多道具）
  if (queueTrigger.length) processTriggerQueue();
  if (chain.length === 0) {
    // 全部消除，胜利
    playSfx('win');
    setState('WIN');
    // 解锁下一关
    if (levelIndex + 1 < LEVELS.length && unlockedLevel < levelIndex + 1) {
      unlockedLevel = levelIndex + 1;
      saveProgress();
    }
    renderLevelList();
  }
}

// 插入后收紧球串间距
function tightenChain() {
  if (chain.length <= 1) return;
  const path = levelData.path;
  const lengths = levelData._lengths;
  // 从领先球开始，后面每个球尽量与前面保持 BALL_GAP
  for (let i = 1; i < chain.length; i++) {
    const prev = chain[i - 1];
    const cur = chain[i];
    const prevPos = tToPoint(path, lengths, prev.t);
    const curPos = tToPoint(path, lengths, cur.t);
    const d = Math.hypot(prevPos.x - curPos.x, prevPos.y - curPos.y);
    if (d > BALL_GAP * 1.5) {
      const dir = tToDir(path, lengths, cur.t);
      const step = Math.min(d - BALL_GAP, 2.5);
      cur.t += step / lengths.total;
      if (cur.t > 1) cur.t = 1;
    }
  }
  // 如果末尾球已经超出路径开始（t 过小），从数组移除（已经走出屏幕？实际上球只往终点走，t 越来越大，不会变小）
  // 但插入新球可能导致某些球 t 变得很小（靠近起点），这是正常的，保留即可
}

/* ==================== 发射器控制 ==================== */
function setAim(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  // 将客户端坐标转到画布逻辑坐标（考虑 dpr 已在 ctx 处理，这里直接用 CSS 像素相对位置）
  const x = (clientX - rect.left) / rect.width * W;
  const y = (clientY - rect.top) / rect.height * H;
  const dx = x - shooter.x;
  const dy = y - shooter.y;
  // 全向瞄准（祖玛原版机制）：任意方向皆可发射
  shooter.angle = Math.atan2(dy, dx);

  aim.x = shooter.x + Math.cos(angle) * 70;
  aim.y = shooter.y + Math.sin(angle) * 70;
  aim.active = true;
  const dot = document.getElementById('aimDot');
  dot.style.left = aim.x + 'px';
  dot.style.top = aim.y + 'px';
  dot.classList.add('visible');
}

function shoot() {
  if (state !== 'PLAYING' || shooter.ball) return;
  const b = {
    x: shooter.x, y: shooter.y,
    vx: Math.cos(shooter.angle) * SHOOT_SPEED,
    vy: Math.sin(shooter.angle) * SHOOT_SPEED,
    r: BALL_R,
    color: shooter.color,
    active: true
  };
  shooter.ball = b;
  playSfx('shoot');
  // 发射口粒子（绿色魔法粉末）
  spawnBurst(shooter.x, shooter.y - BALL_R * 3.2, shooter.color, 6, 0.7);
}

// 触摸/鼠标
canvas.addEventListener('pointermove', (e) => {
  if (state === 'PLAYING') setAim(e.clientX, e.clientY);
});
canvas.addEventListener('pointerdown', (e) => {
  if (state === 'PLAYING') shoot();
});
// 键盘：空格发射，方向键调整角度（PC 友好）
window.addEventListener('keydown', (e) => {
  if (state !== 'PLAYING') return;
  if (e.code === 'Space') { e.preventDefault(); shoot(); }
  if (e.code === 'ArrowLeft')  { shooter.angle -= 0.12; if (shooter.angle < -Math.PI/2-1.0) shooter.angle = -Math.PI/2-1.0; aim.active=false; }
  if (e.code === 'ArrowRight') { shooter.angle += 0.12; if (shooter.angle > -Math.PI/2+1.0) shooter.angle = -Math.PI/2+1.0; aim.active=false; }
});

function resumeGame() { setState('PLAYING'); lastTime = performance.now(); requestAnimationFrame(loop); }
function backToStart() { setState('MENU'); }
function startGame(lv) {
  if (lv > unlockedLevel + 1) return;
  initLevel(lv - 1);
}
function nextLevel() {
  if (levelIndex + 1 >= LEVELS.length) {
    backToStart();
    return;
  }
  startGame(levelIndex + 2); // 1-based
}
function restartLevel() { startGame(levelIndex + 1); }

/* ==================== 进度持久化 ==================== */
function saveProgress() {
  try { localStorage.setItem('zuma_unlocked', String(unlockedLevel)); } catch (e) {}
}
function loadProgress() {
  try {
    const v = localStorage.getItem('zuma_unlocked');
    if (v !== null) unlockedLevel = Math.min(parseInt(v, 10) || 0, LEVELS.length - 1);
  } catch (e) {}
}

/* ==================== 渲染：祖玛级宝石弹珠 ====================
   八层绘制：外投影 → 金属暗边 → 宝石主体 → 底部环境反射 →
             内圈辉光 → 主高光 → 副高光 → 玻璃罩弧
   color 支持数字索引（自动映射 COLORS）或十六进制字符串
=============================================================== */
function drawBall(x, y, r, color, glow = false) {
  if (typeof color === 'number') color = COLORS[color] || '#ef4444';
  ctx.save();
  ctx.translate(x, y);

  // ① 外投影（让球有立体悬浮感）
  ctx.beginPath();
  ctx.ellipse(r * 0.12, r * 0.22, r * 1.02, r * 1.02, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fill();

  // ② 底盘金属暗边（祖玛球特有的深色包边）
  const rimGrad = ctx.createLinearGradient(0, -r, 0, r);
  rimGrad.addColorStop(0, shadeColor(color, 0.45));
  rimGrad.addColorStop(0.45, shadeColor(color, -0.15));
  rimGrad.addColorStop(1, shadeColor(color, -0.62));
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = rimGrad;
  ctx.fill();

  // ③ 宝石主体（斜向主光，左上强、右下暗）
  const body = ctx.createRadialGradient(-r * 0.38, -r * 0.42, r * 0.08, r * 0.15, r * 0.2, r * 1.15);
  body.addColorStop(0, shadeColor(color, 0.72));
  body.addColorStop(0.18, shadeColor(color, 0.34));
  body.addColorStop(0.52, color);
  body.addColorStop(0.82, shadeColor(color, -0.34));
  body.addColorStop(1, shadeColor(color, -0.55));
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
  ctx.fillStyle = body;
  ctx.fill();

  // ④ 底部环境反射（地面/丛林反光，增加球体通透度）
  const bounce = ctx.createRadialGradient(0, r * 0.62, r * 0.05, 0, r * 0.6, r * 0.72);
  bounce.addColorStop(0, 'rgba(255,255,255,0.30)');
  bounce.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.fillStyle = bounce;
  ctx.fill();

  // ⑤ 中心内辉光（宝石发光核）
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.62);
  core.addColorStop(0, 'rgba(255,255,255,0.22)');
  core.addColorStop(0.6, 'rgba(255,255,255,0.05)');
  core.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.fillStyle = core;
  ctx.fill();

  // ⑥ 主高光（左上方水滴形，祖玛球灵魂）
  ctx.save();
  ctx.translate(-r * 0.32, -r * 0.38);
  ctx.rotate(-0.6);
  const hl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.46);
  hl.addColorStop(0, 'rgba(255,255,255,0.95)');
  hl.addColorStop(0.5, 'rgba(255,255,255,0.45)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.30, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fillStyle = hl;
  ctx.fill();
  ctx.restore();

  // ⑦ 副高光（右下方小亮点）
  ctx.beginPath();
  ctx.arc(r * 0.34, r * 0.30, r * 0.11, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();

  // ⑧ 玻璃罩边缘弧（顶部细亮线，增强玻璃质感）
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.80, Math.PI * 1.08, Math.PI * 1.62);
  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.lineWidth = Math.max(1, r * 0.10);
  ctx.lineCap = 'round';
  ctx.stroke();

  // 边框暗线（贴合整体轮廓）
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.97, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.stroke();

  // 发光模式（供选中/道具球使用）
  if (glow) {
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.12, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r * 1.12);
    g.addColorStop(0, 'rgba(255,255,255,0.30)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }

  ctx.restore();
}

/* ==================== 渲染：青蛙石雕发射器 ====================
   祖玛标志性元素：盘坐石蛙、张口含球、背部纹路、底座火盆
=============================================================== */
function drawFrogShooter(sx, sy, angle, ballColor, r) {
  if (typeof ballColor === 'number') ballColor = COLORS[ballColor] || '#ef4444';
  ctx.save();
  ctx.translate(sx, sy);

  const baseR = r * 1.85;

  // 暗色底衬圆盘（让青蛙从丛林照片中凸显，祖玛原版手法）
  const discR = baseR * 1.55;
  const disc = ctx.createRadialGradient(0, baseR * 0.05, discR * 0.25, 0, baseR * 0.05, discR);
  disc.addColorStop(0, 'rgba(8,12,6,0.82)');
  disc.addColorStop(0.72, 'rgba(8,12,6,0.58)');
  disc.addColorStop(1, 'rgba(8,12,6,0)');
  ctx.beginPath();
  ctx.arc(0, baseR * 0.05, discR, 0, Math.PI * 2);
  ctx.fillStyle = disc;
  ctx.fill();
  // 金色装饰环
  ctx.beginPath();
  ctx.arc(0, baseR * 0.05, discR * 0.86, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(240,193,75,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 底座投影
  ctx.beginPath();
  ctx.ellipse(0, baseR * 0.72, baseR * 1.05, baseR * 0.34, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  // 石制底座（两级台阶，提亮）
  const stoneGrad = ctx.createLinearGradient(0, baseR * 0.15, 0, baseR * 0.95);
  stoneGrad.addColorStop(0, '#c4b99f');
  stoneGrad.addColorStop(0.5, '#948b78');
  stoneGrad.addColorStop(1, '#5c5548');
  ctx.beginPath();
  ctx.ellipse(0, baseR * 0.62, baseR * 0.92, baseR * 0.36, 0, 0, Math.PI * 2);
  ctx.fillStyle = stoneGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(30,26,18,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 底座刻纹（放射状石缝）
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, baseR * 0.62, baseR * 0.92, baseR * 0.36, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * baseR * 0.30, baseR * 0.62 + Math.sin(a) * baseR * 0.12);
    ctx.lineTo(Math.cos(a) * baseR * 0.95, baseR * 0.62 + Math.sin(a) * baseR * 0.38);
    ctx.stroke();
  }
  ctx.restore();

  // 蛙身（提亮，带深色轮廓）
  const frogGrad = ctx.createRadialGradient(-baseR * 0.25, -baseR * 0.15, baseR * 0.1, 0, baseR * 0.1, baseR * 0.85);
  frogGrad.addColorStop(0, '#c8ef9a');
  frogGrad.addColorStop(0.35, '#8cc95e');
  frogGrad.addColorStop(0.75, '#5a9436');
  frogGrad.addColorStop(1, '#3a6b22');
  ctx.beginPath();
  ctx.ellipse(0, baseR * 0.18, baseR * 0.62, baseR * 0.50, 0, 0, Math.PI * 2);
  ctx.fillStyle = frogGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(15,30,8,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 蛙背斑点（祖玛石蛙的金色纹路）
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, baseR * 0.18, baseR * 0.62, baseR * 0.50, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = 'rgba(20,60,10,0.32)';
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + 0.4;
    const px = Math.cos(a) * baseR * 0.34;
    const py = baseR * 0.18 + Math.sin(a) * baseR * 0.26;
    ctx.beginPath();
    ctx.ellipse(px, py, baseR * 0.10, baseR * 0.07, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 蛙眼（两颗凸起金瞳，随准星微转）
  const eyeOff = ((angle + Math.PI / 2) % (Math.PI * 2)) * 0.02;
  [-0.34, 0.34].forEach((ox, i) => {
    const ex = baseR * ox, ey = -baseR * 0.22;
    // 眼球
    ctx.beginPath();
    ctx.arc(ex, ey, baseR * 0.155, 0, Math.PI * 2);
    const eg = ctx.createRadialGradient(ex - baseR * 0.05, ey - baseR * 0.06, baseR * 0.02, ex, ey, baseR * 0.16);
    eg.addColorStop(0, '#fff6c2');
    eg.addColorStop(0.5, '#ffd76e');
    eg.addColorStop(1, '#b8860b');
    ctx.fillStyle = eg;
    ctx.fill();
    // 瞳孔（竖向金瞳）
    ctx.beginPath();
    ctx.ellipse(ex + eyeOff, ey, baseR * 0.045, baseR * 0.105, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1206';
    ctx.fill();
    // 眼白高光
    ctx.beginPath();
    ctx.arc(ex - baseR * 0.05, ey - baseR * 0.06, baseR * 0.028, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
  });

  // 前肢（两只石臂托住发射口）
  [-0.56, 0.56].forEach(ox => {
    ctx.beginPath();
    ctx.ellipse(baseR * ox, baseR * 0.34, baseR * 0.20, baseR * 0.30, ox > 0 ? 0.4 : -0.4, 0, Math.PI * 2);
    const lg = ctx.createLinearGradient(baseR * ox, baseR * 0.1, baseR * ox, baseR * 0.65);
    lg.addColorStop(0, '#7cbb58');
    lg.addColorStop(1, '#2f5c1c');
    ctx.fillStyle = lg;
    ctx.fill();
  });

  // 发射口（含球，朝向瞄准方向）
  ctx.save();
  ctx.rotate(angle + Math.PI / 2);
  // 炮口石环
  ctx.beginPath();
  ctx.arc(0, -baseR * 0.30, r * 1.28, 0, Math.PI * 2);
  const ringGrad = ctx.createRadialGradient(0, -baseR * 0.30, r * 0.9, 0, -baseR * 0.30, r * 1.3);
  ringGrad.addColorStop(0, 'rgba(60,120,40,0.95)');
  ringGrad.addColorStop(0.7, '#3d6b28');
  ringGrad.addColorStop(1, '#1e3a12');
  ctx.fillStyle = ringGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,110,0.42)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // 待发球
  drawBall(0, -baseR * 0.30, r, ballColor, true);

  ctx.restore();
}

function shadeColor(color, percent) {
  const f = parseInt(color.slice(1), 16), t = percent < 0 ? 0 : 255, p = percent < 0 ? -percent : percent;
  const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x00FF;
  const toHex = (v) => v.toString(16).padStart(2, '0');
  const calc = (c) => Math.round((t - c) * p + c);
  return '#' + toHex(calc(R)) + toHex(calc(G)) + toHex(calc(B));
}

/* ==================== 渲染：丛林神庙背景（祖玛氛围） ====================
   真实 CC0 热带雨林照片打底（暗化+缓慢视差）+ 程序化氛围层叠加
   素材：Chiapas Rainforest（Wikimedia Commons，CC0 公有领域免费商用）
===================================================================== */
let bgTorches = null;
let bgImage = null;
let bgReady = false;

function initBackgroundImage() {
  if (bgImage) return;
  bgImage = new Image();
  bgImage.onload = () => { bgReady = true; };
  bgImage.onerror = () => { bgReady = false; }; // 加载失败自动回退到纯代码背景
  bgImage.src = 'assets/jungle_bg_opt.jpg';
}
initBackgroundImage();

function initBackground() {
  // 火把位置（四角），带随机相位使火光不同步闪烁
  bgTorches = [
    { x: W * 0.06, y: H * 0.18, phase: 0 },
    { x: W * 0.94, y: H * 0.18, phase: 1.7 },
    { x: W * 0.06, y: H * 0.86, phase: 3.1 },
    { x: W * 0.94, y: H * 0.86, phase: 4.6 },
  ];
}

function drawBackground(t) {
  // ① 丛林底图（真实照片，若加载失败则用渐变兜底）
  if (bgReady && bgImage) {
    // 缓慢视差：随时间极轻微平移，营造呼吸感
    const drift = Math.sin(t * 0.10) * W * 0.012;
    const scale = 1.14;
    const dw = W * scale, dh = H * scale;
    const dx = (W - dw) / 2 + drift;
    const dy = (H - dh) / 2 + Math.cos(t * 0.08) * H * 0.008;
    ctx.drawImage(bgImage, dx, dy, dw, dh);

    // 暗化 + 压绿：让彩球成为绝对视觉焦点（这是祖玛的关键手法）
    ctx.fillStyle = 'rgba(6, 18, 10, 0.52)';
    ctx.fillRect(0, 0, W, H);

    // 中心提亮（祭坛聚光，把视线引向球道）
    const spot = ctx.createRadialGradient(W / 2, H * 0.48, 0, W / 2, H * 0.48, W * 0.62);
    spot.addColorStop(0, 'rgba(190,220,150,0.14)');
    spot.addColorStop(0.55, 'rgba(120,160,90,0.05)');
    spot.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = spot;
    ctx.fillRect(0, 0, W, H);
  } else {
    // 兜底：代码渐变背景
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1c2a1a');
    sky.addColorStop(0.35, '#243b22');
    sky.addColorStop(0.7, '#1a2b18');
    sky.addColorStop(1, '#0d160c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
  }

  // ② 远山雾霭（多层柔和云雾）
  for (let layer = 0; layer < 3; layer++) {
    const yBase = H * (0.18 + layer * 0.10);
    const alpha = 0.05 + layer * 0.025;
    ctx.beginPath();
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 24) {
      const y = yBase + Math.sin((x * 0.011) + layer * 2.1 + t * 0.06) * 26 + Math.sin(x * 0.031 + layer) * 12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150,200,160,' + alpha + ')';
    ctx.fill();
  }

  // ③ 丛林树冠剪影（顶部垂下的枝叶）
  ctx.save();
  ctx.fillStyle = 'rgba(8,20,8,0.62)';
  for (let i = 0; i < 16; i++) {
    const x = (i / 15) * W + Math.sin(i * 3.3) * 18;
    const len = H * (0.10 + ((i * 37) % 13) / 90);
    ctx.beginPath();
    ctx.moveTo(x - 26, -6);
    ctx.quadraticCurveTo(x, len * 0.6, x + 4, len);
    ctx.quadraticCurveTo(x + 24, len * 0.55, x + 34, -6);
    ctx.closePath();
    ctx.fill();
  }
  for (let i = 0; i < 10; i++) {
    const x = (i / 9) * W;
    const y = H * 0.02 + Math.sin(i * 2.7) * 12;
    ctx.beginPath();
    ctx.ellipse(x, y, W * 0.075, H * 0.035, Math.sin(i) * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ④ 神庙石柱（左右两侧对称）
  drawTemplePillar(W * 0.035, H * 0.30, W * 0.075, H * 0.62);
  drawTemplePillar(W * 0.965, H * 0.30, W * 0.075, H * 0.62);

  // ⑤ 火把光晕（暖橙色脉动）
  bgTorches.forEach(tc => {
    const flick = 0.72 + Math.sin(t * 6 + tc.phase) * 0.16 + Math.sin(t * 13 + tc.phase * 2) * 0.08;
    const R = W * 0.16 * flick;
    const g = ctx.createRadialGradient(tc.x, tc.y, 0, tc.x, tc.y, R);
    g.addColorStop(0, 'rgba(255,170,60,' + (0.38 * flick) + ')');
    g.addColorStop(0.4, 'rgba(255,120,30,' + (0.14 * flick) + ')');
    g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.beginPath();
    ctx.arc(tc.x, tc.y, R, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  });

  // ⑥ 中央神圣光柱（祖玛祭坛感）
  const beam = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.55);
  beam.addColorStop(0, 'rgba(255,240,180,0.09)');
  beam.addColorStop(0.5, 'rgba(255,220,140,0.035)');
  beam.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = beam;
  ctx.fillRect(0, 0, W, H);

  // ⑦ 暗角（聚焦画面中心）
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.28, W / 2, H / 2, W * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.52)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

/* 神庙石柱：分节柱身 + 柱头 + 苔藓 */
function drawTemplePillar(cx, cy, pw, ph) {
  ctx.save();
  const g = ctx.createLinearGradient(cx - pw / 2, 0, cx + pw / 2, 0);
  g.addColorStop(0, 'rgba(20,26,18,0.55)');
  g.addColorStop(0.35, 'rgba(120,112,92,0.72)');
  g.addColorStop(0.6, 'rgba(150,142,120,0.68)');
  g.addColorStop(1, 'rgba(30,34,24,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - pw / 2, cy, pw, ph);

  // 柱身分节横纹
  ctx.strokeStyle = 'rgba(0,0,0,0.32)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) {
    const y = cy + (ph / 5) * i;
    ctx.beginPath();
    ctx.moveTo(cx - pw / 2, y);
    ctx.lineTo(cx + pw / 2, y);
    ctx.stroke();
  }

  // 柱头
  ctx.fillStyle = 'rgba(158,150,128,0.75)';
  ctx.fillRect(cx - pw * 0.72, cy - ph * 0.035, pw * 1.44, ph * 0.045);

  // 苔藓（柱脚绿斑）
  ctx.fillStyle = 'rgba(60,110,50,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx - pw * 0.2, cy + ph * 0.92, pw * 0.42, ph * 0.05, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + pw * 0.22, cy + ph * 0.78, pw * 0.3, ph * 0.035, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function tracePath(path) {
  const first = pathPoint(path[0]);
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (let i = 1; i < path.length; i++) {
    const p = pathPoint(path[i]);
    ctx.lineTo(p.x, p.y);
  }
}

/* ==================== 防死局：手球颜色只从链上现存颜色生成 ====================
   某颜色在球链上被清光后，射手不再生成该颜色；
   若当前手球恰好是已消失颜色，自动换成现存颜色。
   （链上仅剩 1-2 颗同色时也能凑成三连，永不卡关）
===================================================================== */
function livingColors() {
  return [...new Set(chain.map(b => b.color))];
}

function pickLivingColor() {
  const lc = livingColors();
  if (!lc.length) return Math.floor(Math.random() * levelData.colors.length);
  return lc[Math.floor(Math.random() * lc.length)];
}

/* ==================== 特效系统：粒子爆炸 + Combo 飘字 ==================== */
let particles = [];
let floatTexts = [];
let comboCount = 0;
let comboTimer = 0;

function spawnBurst(x, y, color, count = 14, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const sp = (1.6 + Math.random() * 3.2) * power;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 0.8,
      life: 1,
      decay: 0.018 + Math.random() * 0.022,
      size: 2 + Math.random() * 4,
      color,
      // 碎片带宝石光泽
      spark: Math.random() < 0.35
    });
  }
  // 中心闪光
  particles.push({
    x, y, vx: 0, vy: 0, life: 1, decay: 0.06,
    size: 18 * power, color: '#ffffff', spark: true, flash: true
  });
}

function spawnFloatText(x, y, text, color = '#ffd76e', size = 20) {
  floatTexts.push({ x, y, text, color, size, life: 1, vy: -1.1 });
}

function updateEffects() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.16;      // 重力
    p.vx *= 0.985;     // 空气阻力
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.y += f.vy;
    f.vy *= 0.97;
    f.life -= 0.014;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) comboCount = 0;
  }
}

function drawEffects() {
  // 粒子
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.flash) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (2 - p.life));
      g.addColorStop(0, 'rgba(255,255,255,' + (p.life * 0.9) + ')');
      g.addColorStop(0.4, 'rgba(255,240,180,' + (p.life * 0.4) + ')');
      g.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (2 - p.life), 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      if (p.spark) {
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * p.life * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + (p.life * 0.8) + ')';
        ctx.fill();
      }
    }
    ctx.restore();
  });

  // 飘字
  floatTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.font = 'bold ' + f.size + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 描边增强可读性
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  });
}

/* ==================== 音效（Web Audio 零依赖） ==================== */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSfx(type, opt = {}) {
  const ac = getAudio();
  if (!ac) return;
  const now = ac.currentTime;

  const tone = (freq, dur, wave = 'sine', vol = 0.12, slideTo = null) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(freq, now);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + dur + 0.02);
  };

  switch (type) {
    case 'shoot':
      tone(520, 0.09, 'square', 0.07, 900);
      break;
    case 'hit':
      tone(300, 0.07, 'triangle', 0.09, 220);
      break;
    case 'pop': {
      // 消除：清脆上行琶音，连击越高音越高
      const base = 440 * Math.pow(1.12, Math.min(comboCount, 8));
      [0, 4, 7].forEach((semi, i) => {
        setTimeout(() => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'triangle';
          o.frequency.value = base * Math.pow(2, semi / 12);
          g.gain.setValueAtTime(0.10, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.18);
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime + 0.2);
        }, i * 45);
      });
      break;
    }
    case 'combo':
      tone(660, 0.16, 'sine', 0.11, 1320);
      break;
    case 'win':
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        setTimeout(() => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.setValueAtTime(0.13, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35);
          o.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime + 0.36);
        }, i * 110);
      });
      break;
    case 'lose':
      tone(220, 0.5, 'sawtooth', 0.14, 70);
      break;
    case 'skull':
      tone(120, 0.35, 'sawtooth', 0.10, 60);
      break;
  }
}

function drawPathPreview(path) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // ① 外石缘（凸起的石道边框，带高光）
  ctx.strokeStyle = 'rgba(196,180,148,0.55)';
  ctx.lineWidth = BALL_GAP + 16;
  tracePath(path);
  ctx.stroke();

  // ② 石板主体
  ctx.strokeStyle = '#6d6152';
  ctx.lineWidth = BALL_GAP + 10;
  tracePath(path);
  ctx.stroke();

  // ③ 深色凹槽底（球滚动的沟槽）
  const groove = ctx.createLinearGradient(0, 0, 0, H);
  groove.addColorStop(0, '#3b3226');
  groove.addColorStop(0.5, '#2a2318');
  groove.addColorStop(1, '#1d1811');
  ctx.strokeStyle = groove;
  ctx.lineWidth = BALL_GAP + 2;
  tracePath(path);
  ctx.stroke();

  // ④ 沟槽内阴影（贴边暗线，制造深度）
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = BALL_GAP + 4;
  ctx.globalCompositeOperation = 'destination-over';
  tracePath(path);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  // ⑤ 石板接缝横纹（沿轨道均匀切分）
  ctx.save();
  ctx.strokeStyle = 'rgba(255,235,190,0.10)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([2, 14]);
  ctx.lineDashOffset = 0;
  ctx.lineWidth = BALL_GAP + 14;
  tracePath(path);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.stroke();
  ctx.restore();

  // ⑥ 终点骷髅洞口
  const end = pathPoint(path[path.length - 1]);
  drawSkullHole(end.x, end.y);

  ctx.restore();
}

/* 祖玛终点：骷髅造型黑洞（骷髅头 + 下颚 + 双眼幽光） */
function drawSkullHole(cx, cy) {
  const R = BALL_R + 13;
  ctx.save();
  ctx.translate(cx, cy);

  // 洞口外圈石环
  const ring = ctx.createRadialGradient(0, 0, R * 0.7, 0, 0, R * 1.25);
  ring.addColorStop(0, '#5c5346');
  ring.addColorStop(0.65, '#3d372c');
  ring.addColorStop(1, 'rgba(30,26,20,0.15)');
  ctx.beginPath();
  ctx.arc(0, 0, R * 1.22, 0, Math.PI * 2);
  ctx.fillStyle = ring;
  ctx.fill();

  // 骷髅头骨（白骨骷髅轮廓）
  ctx.beginPath();
  ctx.arc(0, -R * 0.08, R * 0.90, 0, Math.PI * 2);
  const boneGrad = ctx.createRadialGradient(-R * 0.3, -R * 0.4, R * 0.1, 0, 0, R);
  boneGrad.addColorStop(0, '#efe6d0');
  boneGrad.addColorStop(0.6, '#c9bda2');
  boneGrad.addColorStop(1, '#8b8170');
  ctx.fillStyle = boneGrad;
  ctx.fill();

  // 下颚
  ctx.beginPath();
  ctx.moveTo(-R * 0.48, R * 0.52);
  ctx.lineTo(R * 0.48, R * 0.52);
  ctx.lineTo(R * 0.34, R * 0.92);
  ctx.lineTo(-R * 0.34, R * 0.92);
  ctx.closePath();
  ctx.fillStyle = '#bcb097';
  ctx.fill();
  // 牙齿咬合线
  ctx.strokeStyle = 'rgba(60,50,38,0.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-R * 0.40, R * 0.68);
  ctx.lineTo(R * 0.40, R * 0.68);
  ctx.stroke();

  // 眼窝（深邃黑洞，带幽绿磷光）
  [-R * 0.36, R * 0.36].forEach(ox => {
    ctx.beginPath();
    ctx.ellipse(ox, -R * 0.12, R * 0.24, R * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#100c08';
    ctx.fill();
    const eyeGlow = ctx.createRadialGradient(ox, -R * 0.12, 0, ox, -R * 0.12, R * 0.26);
    eyeGlow.addColorStop(0, 'rgba(140,255,140,0.55)');
    eyeGlow.addColorStop(1, 'rgba(140,255,140,0)');
    ctx.beginPath();
    ctx.ellipse(ox, -R * 0.12, R * 0.20, R * 0.23, 0, 0, Math.PI * 2);
    ctx.fillStyle = eyeGlow;
    ctx.fill();
  });

  // 鼻腔
  ctx.beginPath();
  ctx.moveTo(0, R * 0.16);
  ctx.lineTo(-R * 0.12, R * 0.36);
  ctx.lineTo(R * 0.12, R * 0.36);
  ctx.closePath();
  ctx.fillStyle = '#171008';
  ctx.fill();

  ctx.restore();
}

function drawShooter() {
  ctx.save();
  ctx.translate(shooter.x, shooter.y);
  ctx.rotate(shooter.angle);
  // 发射器底座
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(-18, 0, 36, 34);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(-18, 0, 36, 34);
  // 当前球
  drawBall(0, 14, BALL_R, shooter.color, true);
  // 发射方向线
  ctx.strokeStyle = 'rgba(255,215,110,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 14);
  ctx.lineTo(Math.cos(shooter.angle) * 60, 14 + Math.sin(shooter.angle) * 60);
  ctx.stroke();
  ctx.restore();
}

function drawShot() {
  if (!shooter.ball || !shooter.ball.active) return;
  const b = shooter.ball;
  drawBall(b.x, b.y, b.r, b.color, true);
}

function drawChain(t) {
  const path = levelData.path;
  const lengths = levelData._lengths;
  // 从后往前画，让前面的球盖住后面
  for (let i = chain.length - 1; i >= 0; i--) {
    const c = chain[i];
    const p = tToPoint(path, lengths, c.t);
    // 只画画布内的
    if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) continue;
    const glowing = (i === 0); // 领先球发光
    drawBall(p.x, p.y, c.r, c.color, glowing || !!c.power);
    if (c.power) drawPowerupIcon(p.x, p.y, c.r, c.power, t);
  }
}

/* ==================== 道具球图案（覆盖在弹珠上） ==================== */
const POWERUP_META = {
  bomb:     { name: '炸弹',  icon: '💣', color: '#1f2937', tip: '炸掉周围一圈球' },
  lightning:{ name: '闪电',  icon: '⚡', color: '#facc15', tip: '电清前方一段球' },
  freeze:   { name: '冰冻',  icon: '❄️', color: '#7dd3fc', tip: '球串冰冻5秒' },
  rewind:   { name: '回退',  icon: '⏪', color: '#4ade80', tip: '球链后退一大段' },
};

function drawPowerupIcon(x, y, r, type, t) {
  ctx.save();
  ctx.translate(x, y);
  // 脉动光环提示这是道具球
  const pulse = 0.55 + Math.sin(t * 5) * 0.25;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,' + (pulse * 0.8) + ')';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (type === 'bomb') {
    // 黑色炸弹体 + 火花引信
    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(r * 0.05, -r * 0.22); ctx.quadraticCurveTo(r * 0.22, -r * 0.42, r * 0.10, -r * 0.55); ctx.stroke();
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(r * 0.10, -r * 0.56, r * 0.12 + Math.sin(t * 12) * r * 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-r * 0.14, r * 0.02, r * 0.10, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'lightning') {
    // 金色闪电折线
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(r * 0.14, -r * 0.58);
    ctx.lineTo(-r * 0.16, r * 0.02);
    ctx.lineTo(r * 0.02, r * 0.02);
    ctx.lineTo(-r * 0.14, r * 0.58);
    ctx.lineTo(r * 0.22, -r * 0.10);
    ctx.lineTo(r * 0.02, -r * 0.10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 1.2; ctx.stroke();
  } else if (type === 'freeze') {
    // 雪花：三轴交叉
    ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI / 3 + t * 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
      ctx.lineTo(-Math.cos(a) * r * 0.5, -Math.sin(a) * r * 0.5);
      ctx.stroke();
      // 枝杈
      [-1, 1].forEach(sd => {
        const ex = Math.cos(a) * r * 0.5 * sd, ey = Math.sin(a) * r * 0.5 * sd;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex + Math.cos(a + 0.6) * r * 0.18 * sd, ey + Math.sin(a + 0.6) * r * 0.18 * sd);
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex + Math.cos(a - 0.6) * r * 0.18 * sd, ey + Math.sin(a - 0.6) * r * 0.18 * sd);
        ctx.stroke();
      });
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'rewind') {
    // 双左箭头（绿色）
    ctx.fillStyle = '#14532d';
    [-r * 0.16, r * 0.22].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(ox, -r * 0.30);
      ctx.lineTo(ox - r * 0.30, 0);
      ctx.lineTo(ox, r * 0.30);
      ctx.closePath();
      ctx.fill();
    });
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1.4;
    [-r * 0.16, r * 0.22].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(ox, -r * 0.30);
      ctx.lineTo(ox - r * 0.30, 0);
      ctx.lineTo(ox, r * 0.30);
      ctx.stroke();
    });
  }
  ctx.restore();
}

/* ==================== 道具触发效果 ==================== */
let freezeT = 0; // 冰冻剩余帧数
let queueTrigger = []; // 道具触发队列（支持连锁引爆）

function processTriggerQueue() {
  let guard = 0;
  while (queueTrigger.length && guard++ < 12) {
    const job = queueTrigger.shift();
    // 索引在之前的消除中可能已偏移，收紧到合法范围
    if (!chain.length) break;
    const idx = Math.max(0, Math.min(job.idx, chain.length - 1));
    // removeOnly：该道具球已随组消除，只需入队时已记下类型——直接触发相邻效果
    if (job.removeOnly && chain[idx] && chain[idx].power === job.type) {
      // 道具球还在链上（未被组消除覆盖到），从触发点引爆
    }
    if (!job.removeOnly && chain[idx] && chain[idx].power === job.type) {
      chain.splice(idx, 1);
    }
    triggerPowerup(idx, job.type);
    updateHud();
  }
  queueTrigger = [];
}

function triggerPowerup(idx, type) {
  const path = levelData.path;
  const lengths = levelData._lengths;
  const meta = POWERUP_META[type];

  if (type === 'bomb') {
    // 炸弹：消除命中点前后各4球（无视颜色），带屏幕震动
    const from = Math.max(0, idx - 4);
    const to = Math.min(chain.length - 1, idx + 4);
    for (let k = to; k >= from; k--) {
      const b = chain[k];
      const pos = tToPoint(path, lengths, b.t);
      spawnBurst(pos.x, pos.y, b.color, 10, 1.3);
      if (b.power && k !== idx) queueTrigger.push({ idx: k, type: b.power });
    }
    chain.splice(from, to - from + 1);
    shake = 14;
    spawnFloatText(midPointX(path, lengths, from), 0, '', '#fff'); // 占位避免空引用
    spawnFloatText(sxOf(from), syOf(from) - 24, '💣 爆炸！', '#f97316', 24);
    playSfx('crash');
    tightenChain();
  } else if (type === 'lightning') {
    // 闪电：电清命中点向前（朝洞口方向）5球
    const from = idx;
    const to = Math.min(chain.length - 1, idx + 5);
    for (let k = to; k >= from; k--) {
      const b = chain[k];
      const pos = tToPoint(path, lengths, b.t);
      spawnBurst(pos.x, pos.y, '#fde047', 12, 1.2);
      if (b.power && k !== idx) queueTrigger.push({ idx: k, type: b.power });
      // 电光折线粒子
      if (k > from) {
        const prev = chain[k - 1] || chain[k];
        const pPrev = tToPoint(path, lengths, prev.t);
        particles.push({ x: (pPrev.x + pos.x) / 2, y: (pPrev.y + pos.y) / 2, vx: 0, vy: 0,
          life: 0.8, decay: 0.05, size: 6, color: '#fde047', spark: true, flash: true });
      }
    }
    chain.splice(from, to - from + 1);
    playSfx('combo');
    tightenChain();
  } else if (type === 'freeze') {
    // 冰冻：球链停止 5 秒
    freezeT = 300;
    chain.forEach(b => {
      const pos = tToPoint(path, lengths, b.t);
      spawnBurst(pos.x, pos.y, '#7dd3fc', 4, 0.5);
    });
    spawnFloatText(sxOf(idx), syOf(idx) - 24, '❄️ 冰冻 5 秒！', '#7dd3fc', 22);
    playSfx('win');
  } else if (type === 'rewind') {
    // 回退：整条球链后退 12% 路径
    chain.forEach(b => {
      b.t = Math.max(0, b.t - 0.12);
      const pos = tToPoint(path, lengths, b.t);
      spawnBurst(pos.x, pos.y, '#4ade80', 3, 0.4);
    });
    spawnFloatText(sxOf(idx), syOf(idx) - 24, '⏪ 球链回退！', '#4ade80', 22);
    playSfx('pop');
  }
}

// 辅助：道具触发提示文字的坐标（用索引取位置，越界自动收拢到链尾）
function sxOf(idx) {
  const i = Math.max(0, Math.min(idx, chain.length - 1));
  if (!chain.length) return W / 2;
  return tToPoint(levelData.path, levelData._lengths, chain[i].t).x;
}
function syOf(idx) {
  const i = Math.max(0, Math.min(idx, chain.length - 1));
  if (!chain.length) return H / 2;
  return tToPoint(levelData.path, levelData._lengths, chain[i].t).y;
}
function midPointX(path, lengths, from) {
  return 0;
}

function drawHudCanvas() {
  // 画布内无额外 HUD，全部用 DOM。此处保留以备扩展
}

function drawFrame() {
  if (!levelData) return;
  const t = performance.now() / 1000;   // 全帧统一时间变量（背景/道具/蛙眼脉动共用）
  const now = t;
  ctx.clearRect(0, 0, W, H);

  // 丛林神庙背景（多层视差 + 火把光晕 + 暗角）
  if (!bgTorches) initBackground();
  drawBackground(now);

  drawPathPreview(levelData.path);
  drawChain(t);
  // ❄️ 冰冻状态：全屏冰蓝覆盖 + 球串冰晶感
  if (freezeT > 0) {
    ctx.fillStyle = 'rgba(125,211,252,0.16)';
    ctx.fillRect(0, 0, W, H);
    const frost = ctx.createRadialGradient(W/2, H/2, W*0.1, W/2, H/2, W*0.6);
    frost.addColorStop(0, 'rgba(224,242,254,0.10)');
    frost.addColorStop(1, 'rgba(125,211,252,0.22)');
    ctx.fillStyle = frost;
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = '#e0f2fe';
    ctx.fillText('❄️ 冰冻 ' + Math.ceil(freezeT / 60) + 's', W / 2, 30);
  }
  drawShot();
  drawFrogShooter(shooter.x, shooter.y, shooter.angle, shooter.color, BALL_R);
  drawEffects();   // 粒子与飘字（最上层，覆盖所有元素）
  drawHudCanvas();
}

function updateHud() {
  document.getElementById('levelText').textContent = levelIndex + 1;
  document.getElementById('levelTotal').textContent = LEVELS.length;
  document.getElementById('scoreText').textContent = score;
  document.getElementById('remainText').textContent = chain.length;
  // 下一球预览
  const dot = document.getElementById('nextColorDot');
  const txt = document.getElementById('nextColor');
  if (shooter && dot) {
    dot.style.backgroundColor = (typeof shooter.color === 'number') ? COLORS[shooter.color] : shooter.color;
    txt.textContent = colorName(shooter.color);
  }
}

function colorName(hex) {
  const names = ['红', '黄', '绿', '蓝', '紫', '白', '青'];
  const idx = (typeof hex === 'number') ? hex : COLORS.indexOf(hex);
  return (idx >= 0 && idx < names.length) ? names[idx] : '?';
}

/* ==================== 主菜单关卡列表 ==================== */
function renderLevelList() {
  const list = document.getElementById('levelList');
  list.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const btn = document.createElement('button');
    btn.className = 'lv-btn' + (i <= unlockedLevel ? '' : ' locked') + (i === levelIndex && state === 'MENU' ? ' active' : '');
    btn.textContent = `第 ${i + 1} 关`;
    btn.title = lv.name;
    if (i <= unlockedLevel) {
      btn.onclick = () => startGame(i + 1);
    }
    list.appendChild(btn);
  });
  // 高亮当前选中（若在菜单）
  if (state === 'MENU') {
    const btns = list.querySelectorAll('.lv-btn');
    if (btns[levelIndex]) btns[levelIndex].classList.add('active');
  }
}

/* ==================== 入口 ==================== */
window.addEventListener('resize', resize);
window.addEventListener('load', () => {
  resize();
  loadProgress();
  renderLevelList();
  setState('MENU');
});
