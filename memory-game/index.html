<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>记忆翻牌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 45%, #a855f7 100%);
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px);
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
    position: relative;
  }
  /* 漂浮光斑氛围（祖玛级氛围手法） */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 44vmax; height: 44vmax;
    left: -12vmax; top: -10vmax;
    background: radial-gradient(circle, rgba(255,220,140,.20) 0%, transparent 70%);
    animation: bokeh1 14s ease-in-out infinite alternate;
  }
  body::after {
    width: 50vmax; height: 50vmax;
    right: -14vmax; bottom: -12vmax;
    background: radial-gradient(circle, rgba(140,220,255,.16) 0%, transparent 70%);
    animation: bokeh2 18s ease-in-out infinite alternate;
  }
  @keyframes bokeh1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vmax,4vmax) scale(1.15); } }
  @keyframes bokeh2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-5vmax,-6vmax) scale(.95); } }
  header, .levels, .stats, .grid, .footer, .overlay { position: relative; z-index: 1; }
  header { width: min(94vw, 420px); text-align: center; }
  h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .subtitle { font-size: 12px; opacity: .75; margin-top: 4px; letter-spacing: 1px; }

  .levels { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .levels button {
    border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12);
    color: #fff; font-size: 13px; padding: 6px 14px; border-radius: 999px;
    cursor: pointer; transition: all .2s;
  }
  .levels button.active { background: #fff; color: #4f46e5; border-color: #fff; font-weight: 600; }

  .stats { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .stat {
    background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
    border-radius: 12px; padding: 6px 14px; text-align: center; min-width: 72px;
  }
  .stat .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 11px; opacity: .8; }

  #board {
    display: grid; gap: 10px;
    width: min(94vw, 420px);
    margin-top: 14px;
  }
  .card { aspect-ratio: 3/4; perspective: 700px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.25,.8,.3,1.2);
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; display: flex; align-items: center; justify-content:center;
    font-size: clamp(30px, 9.5vw, 46px);
  }
  .back {
    background:
      radial-gradient(circle at 30% 25%, rgba(255,215,110,.22) 0%, transparent 42%),
      radial-gradient(circle at 72% 78%, rgba(129,140,248,.35) 0%, transparent 46%),
      linear-gradient(150deg, #2b2f6e 0%, #3d3a8c 48%, #241f52 100%);
    box-shadow: 0 4px 12px rgba(0,0,0,.30), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 8px rgba(0,0,20,.35);
    border: 2px solid rgba(255,215,110,.34);
    font-size: clamp(22px, 7vw, 30px);
    color: rgba(255,224,130,.92);
    text-shadow: 0 0 10px rgba(255,215,110,.6), 0 1px 2px rgba(0,0,0,.5);
  }
  /* 金色菱形纹章框 */
  .back::before {
    content: '';
    position: absolute; inset: 9%;
    border: 1.5px solid rgba(255,215,110,.42);
    border-radius: 10px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,215,110,.20) 0 2px, transparent 3px),
      radial-gradient(circle at 50% 82%, rgba(255,215,110,.20) 0 2px, transparent 3px);
    pointer-events: none;
  }
  .back::after {
    content: '✦';
    position: absolute; top: 6px; right: 9px;
    font-size: clamp(10px, 2.6vw, 13px);
    color: rgba(255,224,130,.55);
    text-shadow: none;
  }
  .front {
    background:
      radial-gradient(circle at 50% 88%, rgba(255,203,110,.16) 0%, transparent 55%),
      linear-gradient(160deg, #fffdf4 0%, #fdf6e3 100%);
    box-shadow: inset 0 0 0 2px rgba(255,203,110,.45), inset 0 0 0 5px rgba(255,255,255,.9);
    transform: rotateY(180deg);
    box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .card.matched .front {
    box-shadow: 0 0 0 3px #34d399, 0 4px 10px rgba(0,0,0,.18);
  }
  .card.matched { animation: pop .4s ease, matchedGlow 1.6s ease .1s; pointer-events: none; }
  @keyframes matchedGlow {
    0%   { box-shadow: 0 0 0 rgba(255,215,110,0); }
    30%  { box-shadow: 0 0 26px rgba(255,215,110,.95), 0 0 44px rgba(255,203,110,.5); }
    100% { box-shadow: 0 0 12px rgba(255,215,110,.35); }
  }
  /* 配对星星粒子 */
  .spark-star {
    position: absolute; width: 10px; height: 10px; pointer-events: none; z-index: 60;
    animation: sparkFly .8s ease-out forwards;
  }
  .spark-star::before { content: '✦'; font-size: inherit; color: inherit; }
  @keyframes sparkFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .card.shake .card-inner { animation: shake .35s ease; }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-5px); }
    75% { transform: rotateY(180deg) translateX(5px); }
  }

  .footer { margin-top: 14px; display: flex; align-items: center; gap: 14px; font-size: 12px; opacity: .85; }
  .footer button {
    background: rgba(255,255,255,.16); border: none; color: #fff;
    font-size: 16px; border-radius: 10px; padding: 4px 10px; cursor: pointer;
  }
  .best { font-variant-numeric: tabular-nums; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(30, 20, 70, .72); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
  }
  #overlay.show { display: flex; }
  .panel {
    background: linear-gradient(160deg, #ffffff, #f1f0ff);
    color: #4338ca; border-radius: 20px; padding: 28px 30px;
    text-align: center; width: min(86vw, 340px);
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
    animation: rise .35s ease;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel .trophy { font-size: 52px; }
  .panel h2 { font-size: 22px; margin: 8px 0 4px; }
  .panel .result { font-size: 15px; color: #6d28d9; margin-bottom: 6px; }
  .panel .record { font-size: 13px; color: #059669; min-height: 18px; font-weight: 600; }
  .panel button {
    margin-top: 16px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff; font-size: 16px; font-weight: 600;
    padding: 12px 36px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(99,102,241,.45);
  }
  .panel button:active { transform: scale(.96); }
</style>
</head>
<body>
<header>
  <h1>🃏 记忆翻牌</h1>
  <div class="subtitle">翻开两张相同的牌即配对成功</div>
  <div class="levels">
    <button data-level="easy">简单 4×3</button>
    <button data-level="normal" class="active">标准 4×4</button>
    <button data-level="hard">挑战 4×5</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="moves">0</div><div class="label">步数</div></div>
    <div class="stat"><div class="num" id="time">0:00</div><div class="label">用时</div></div>
    <div class="stat"><div class="num" id="pairs">0/8</div><div class="label">配对</div></div>
  </div>
</header>

<div id="board"></div>

<div class="footer">
  <button id="mute" title="音效开关">🔊</button>
  <span class="best" id="best">最佳：--</span>
</div>

<div id="overlay">
  <div class="panel">
    <div class="trophy">🏆</div>
    <h2>全部配对成功！</h2>
    <div class="result" id="result"></div>
    <div class="record" id="record"></div>
    <button id="again">再来一局</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var EMOJIS = ['🐶','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐔','🦉','🦋'];
  var LEVELS = {
    easy:   { rows: 3, cols: 4, pairs: 6  },
    normal: { rows: 4, cols: 4, pairs: 8  },
    hard:   { rows: 5, cols: 4, pairs: 10 }
  };

  var board = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var pairsEl = document.getElementById('pairs');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var resultEl = document.getElementById('result');
  var recordEl = document.getElementById('record');

  var level = 'normal';
  var first = null;      // 第一次翻开的牌
  var lock = false;      // 配对判定期间锁输入
  var moves = 0;
  var matched = 0;
  var timerInt = null;
  var startAt = 0;
  var muted = localStorage.getItem('memoryflip.muted') === '1';

  /* ---------- 音效（WebAudio 合成，无外部资源） ---------- */
  var actx = null;
  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, delay, type, vol) {
    if (!actx || muted) return;
    var t = actx.currentTime + (delay || 0);
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  var sFlip  = function () { tone(520, 0.08, 0, 'triangle', 0.07); };
  var sMatch = function () { tone(660, 0.12, 0); tone(880, 0.16, 0.1); tone(1320, 0.2, 0.2); };
  // 配对星光粒子：从两张卡片中心飞出小星星
  function spawnStars(el) {
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var colors = ['#ffd76e', '#fff', '#ffe9a8', '#a5f3fc'];
    for (var i = 0; i < 8; i++) {
      var s = document.createElement('span');
      s.className = 'spark-star';
      var a = (i / 8) * Math.PI * 2 + Math.random() * 0.6;
      var dist = 46 + Math.random() * 52;
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.fontSize = (9 + Math.random() * 8) + 'px';
      s.style.color = colors[i % colors.length];
      s.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * dist - 24).toFixed(0) + 'px');
      document.body.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 850); })(s);
    }
  }
  var sMiss  = function () { tone(220, 0.15, 0, 'sawtooth', 0.05); };
  var sWin   = function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.18, i * 0.12); }); };

  /* ---------- 工具 ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }
  function bestKey() { return 'memoryflip.best.' + level; }
  function loadBest() {
    try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; }
  }
  function showBest() {
    var b = loadBest();
    bestEl.textContent = b ? ('最佳：' + b.moves + ' 步 / ' + fmt(b.time)) : '最佳：--';
  }

  /* ---------- 计时 ---------- */
  function startTimer() {
    if (timerInt) return;
    startAt = Date.now();
    timerInt = setInterval(function () {
      timeEl.textContent = fmt(Math.floor((Date.now() - startAt) / 1000));
    }, 500);
  }
  function stopTimer() {
    clearInterval(timerInt); timerInt = null;
  }

  /* ---------- 建局 ---------- */
  function build() {
    var cfg = LEVELS[level];
    first = null; lock = false; moves = 0; matched = 0;
    stopTimer();
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    pairsEl.textContent = '0/' + cfg.pairs;
    overlay.classList.remove('show');
    showBest();

    var pool = shuffle(EMOJIS.slice()).slice(0, cfg.pairs);
    var deck = shuffle(pool.concat(pool));

    board.style.gridTemplateColumns = 'repeat(' + cfg.cols + ', 1fr)';
    board.innerHTML = '';
    deck.forEach(function (emoji) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face back">❓</div>' +
          '<div class="face front">' + emoji + '</div>' +
        '</div>';
      card.dataset.emoji = emoji;
      card.addEventListener('click', function () { onFlip(card); });
      board.appendChild(card);
    });
  }

  /* ---------- 核心逻辑 ---------- */
  function onFlip(card) {
    ensureAudio();
    if (lock || card === first) return;
    if (card.classList.contains('matched') || card.classList.contains('flipped')) return;

    startTimer();
    card.classList.add('flipped');
    sFlip();

    if (!first) { first = card; return; }

    moves++;
    movesEl.textContent = moves;

    var a = first, b = card;
    first = null;

    if (a.dataset.emoji === b.dataset.emoji) {
      // 配对成功
      setTimeout(function () {
        a.classList.add('matched'); b.classList.add('matched');
        spawnStars(a); spawnStars(b);
        a.classList.remove('flipped'); b.classList.remove('flipped');
        matched++;
        pairsEl.textContent = matched + '/' + LEVELS[level].pairs;
        sMatch();
        if (matched === LEVELS[level].pairs) win();
      }, 260);
    } else {
      // 配对失败：短暂展示后翻回
      lock = true;
      a.classList.add('shake'); b.classList.add('shake');
      sMiss();
      setTimeout(function () {
        a.classList.remove('flipped', 'shake');
        b.classList.remove('flipped', 'shake');
        lock = false;
      }, 750);
    }
  }

  function win() {
    stopTimer();
    var sec = Math.floor((Date.now() - startAt) / 1000);
    sWin();

    var isRecord = false;
    var best = loadBest();
    if (!best || moves < best.moves || (moves === best.moves && sec < best.time)) {
      localStorage.setItem(bestKey(), JSON.stringify({ moves: moves, time: sec }));
      isRecord = true;
    }
    showBest();

    resultEl.textContent = '用了 ' + moves + ' 步 / ' + fmt(sec);
    recordEl.textContent = isRecord ? '🎉 新纪录！' : '';
    confetti();
    setTimeout(function () { overlay.classList.add('show'); }, 650);
  }

  /* 胜利撒花：全屏彩色纸屑 */
  function confetti() {
    var colors = ['#ffd76e', '#ff6b8a', '#7ee0a3', '#7ec8ff', '#c8a2ff', '#fff'];
    for (var i = 0; i < 60; i++) {
      var p = document.createElement('span');
      p.style.cssText = 'position:fixed;top:-14px;left:' + (Math.random() * 100) + 'vw;' +
        'width:' + (6 + Math.random() * 7) + 'px;height:' + (9 + Math.random() * 8) + 'px;' +
        'background:' + colors[i % colors.length] + ';' +
        'border-radius:' + (Math.random() < 0.5 ? '50%' : '2px') + ';' +
        'z-index:99;pointer-events:none;' +
        'transition:transform ' + (2.4 + Math.random() * 1.6) + 's cubic-bezier(.3,.6,.6,1),opacity 3s;';
      document.body.appendChild(p);
      (function (node, delay) {
        setTimeout(function () {
          node.style.transform = 'translate(' + ((Math.random() - 0.5) * 160) + 'px,' + (window.innerHeight + 60) + 'px) rotate(' + ((Math.random() - 0.5) * 900) + 'deg)';
          node.style.opacity = '0';
        }, delay);
        setTimeout(function () { node.remove(); }, delay + 4200);
      })(p, Math.random() * 500);
    }
  }

  /* ---------- 交互绑定 ---------- */
  document.querySelectorAll('.levels button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelector('.levels .active').classList.remove('active');
      btn.classList.add('active');
      level = btn.dataset.level;
      build();
    });
  });
  document.getElementById('again').addEventListener('click', build);

  var muteBtn = document.getElementById('mute');
  function renderMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    localStorage.setItem('memoryflip.muted', muted ? '1' : '0');
    renderMute();
    if (!muted) { ensureAudio(); sFlip(); }
  });
  renderMute();

  build();
})();
</script>
</body>
</html>
